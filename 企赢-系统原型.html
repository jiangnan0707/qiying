</style></head><body><header class="proto-top" id="top"></header><main id="app"></main><dialog id="modal" aria-labelledby="modal-title"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div><script id="catalog-data" type="application/json">[{"id":"D01","name":"员工费用报销","domain":"finance","kind":"核心","goal":"把员工垫付费用转成有依据、可审批、可支付、可核算的业务记录。","trigger":"员工发生差旅、办公或其他经企业制度允许的垫付费用。","actors":"员工提交并确认；指定审批人确认业务必要性；财务核对与办理资金、会计事项。员工只看本人及获授权记录。","fields":["申请人、费用日期、事由、费用类型、明细金额、收款信息、关联业务/借款、附件及版本"],"materials":["原始表达","发票、行程、消费或其他业务依据","审批意见","支付凭据"],"steps":["整理原话和附件，形成可修改草稿并标记缺项","员工核对明细、归属与金额，确认提交","按企业规则进入指定审批人，超过阈值时追加相应批准","财务核对资料、费用口径、借款关系及重复事项","按批准金额登记实际付款或关联冲借款，反馈员工","形成报销台账，衔接财务核算资料与凭证处理"],"states":"草稿 → 待确认 → 待审批 → 待财务核对 → 待支付 → 办理完成；补正、撤回和会计状态另行记录。","rules":["金额按明细准确求和，申请、批准、已付分别保存","退回保留原件与原审批意见；实付不能被撤回抹除","同一笔费用在报销、资金和会计记录中关联引用，不能重复计费"],"exceptions":["缺件：说明具体缺项并退回对应人员","重复疑点：提示冲突依据，由财务确认后继续","部分支付或支付失败：保存成功部分和剩余待办"],"outputs":["报销台账","支付或借款冲抵记录","财务核算资料与会计依据"],"acceptance":["提交前能核对所有明细及来源","批准未付款时，员工看到待支付而不是已完成","补件重提后原附件、意见和版本仍可查看"],"related":["D02","F05","F06"],"demo":true,"category":"office","initiator":"员工从“日常办公工作台”发起报销。","employee":"确认明细、提供票据、补件并查看本人待付款/到账进度。","operator":"负责人审批；财务核对、付款或冲借款，并按专业规则衔接凭证。","entry":"日常办公工作台发起；财务工作台办理","workbench":"office","center":"business"},{"id":"D02","name":"员工借款、备用金与核销","domain":"finance","kind":"核心","goal":"在同一业务中完成员工借款或备用金申请、实际放款、报销冲抵、资金归还与余额结清。","trigger":"员工需预先取得业务资金，或已有未清借款需要报销冲抵、归还、延期或更正。","actors":"员工或指定备用金保管人发起并提供依据；负责人确认用途、额度及期限；财务核对放款和核销；特殊差异或延期由授权人确认。员工只看本人及获授权记录。","fields":["借款人/保管人、主体、用途、申请金额、批准金额、预计核销日、收款方及关联业务","原借款编号、各次实放金额/日期/凭据、当前未清余额","核销方式、关联报销编号、冲抵金额、实退金额/到账凭据、补付款及差额原因","延期/更正依据、批准记录、原/新期限、确认人与操作历史"],"materials":["用途说明和资金使用安排","申请、额度及期限批准记录","实际放款凭据","已确认报销及费用依据","归还到账凭据、延期或更正依据"],"steps":["提交借款或备用金用途、金额、核销期限及关联事项，核对本人未清余额","负责人确认用途、额度和期限；逾期未清的情况明确是否继续放款","财务核对收款信息及授权，登记实际放款，形成同一借款项下的逐笔放款记录","用户在原事项中选择报销冲抵、资金归还或二者组合，关联费用及到账依据","财务核对可冲抵费用、实际退款和未清余额，记录本次核销明细","报销金额超过可冲抵借款时，将剩余应付员工金额交报销付款处理；借款仍有余额时继续归还或跟进","按实际核销结果更新未清余额，临期或逾期向责任人提醒；延期需授权并保留原期限","余额结清后确认办结；需要更正时关联原操作、保留前后金额及受影响结果"],"states":"申请：待确认 → 待批准 → 待放款；实际借款：已放款未清 → 核销核对中 → 部分核销/已结清；分次放款、延期、退回和更正分别记录。","rules":["申请及批准不会增加实际借款余额，放款失败不计入实放；放款属于往来资金，不直接认定为费用","未清余额按实际放款减已确认报销冲抵和实际归还累计，分次发生保留每笔依据","冲抵须引用已确认费用，不凭口头说明核销；同一费用已经冲抵的金额不再作为应付员工款重复支付","各次冲抵和归还累计不得超过该借款可核销余额；超额资金或差额交财务另行核对，不能直接形成负借款余额","归还款减少往来，不新增费用；重复导入同一放款、到账或核销事件不重复改变余额","合并申请与核销入口后，保留批准、放款、资料、核销和未清状态；已有实际放款不能通过撤回申请删除"],"exceptions":["原借款逾期：负责人确认后续处理，不自动续期或追加额度","部分放款：分别显示批准额、实际放款及未放部分；用途变化须核对受影响授权","退款未到账或报销未确认：保持待核对，不提前减少实际余额","报销大于借款：仅支付冲抵后的差额；报销不足时保留未清余额及到期跟进","核销错误：授权更正并恢复受影响余额，保留原操作及相关报销/资金关系"],"outputs":["统一借款与备用金台账，包括申请、放款、核销及余额","逐笔报销冲抵、资金归还、补付款关系","到期/逾期、延期及更正记录"],"acceptance":["同一事项中可以从申请、放款继续办理多次冲抵或归还，无需重建一笔借款","实放2000元、已确认报销冲抵1200元、实际归还800元时，借款余额为0；三类事件均可查","借款2000元对应已确认报销2500元时，仅剩500元进入报销付款，不再向员工支付全部2500元","批准但未放款不增加余额；重复放款凭据或核销事件不会重复累计","退款尚未到账时仍保留相应未清余额，延期或更正可追到原记录"],"related":["D01","F02","B01","F06"],"demo":false,"category":"office","initiator":"员工或获授权备用金保管人发起，后续在原事项中继续核销。","employee":"确认用途和金额，提交报销冲抵或归还依据，查看本人未清余额。","operator":"负责人确认额度与期限；财务核对放款、冲抵、到账和余额结清。","entry":"日常办公工作台发起；财务工作台办理","workbench":"office","center":"business"},{"id":"D03","name":"付款申请","domain":"finance","kind":"核心","goal":"将企业对外付款的申请、业务依据、批准、实际支付和剩余应付串成可核对的记录。","trigger":"合同约定、订单、服务账单或其他已确认业务产生付款需要，包括预付、到期支付或验收后的结算。","actors":"获授权业务经办人说明用途及金额依据；负责人批准；财务核对资料、收款信息并记录实际支付及会计衔接。无关岗位不默认查看付款明细。","fields":["申请人、付款事由、业务类型、收款方及账户、币种、申请金额、期望支付日","关联业务、订单/账单编号、合同编号（如有）、付款条件、交付/验收状态（适用时）","批准金额、各次实付金额及凭据、累计已付、剩余应付、发票或补件状态"],"materials":["按业务性质提供合同、订单、账单或其他付款依据，无正式合同时不强制创建合同","适用时的交付、验收、结算或预付条件确认","发票或待补说明及批准记录","实际支付凭据与财务核对结果"],"steps":["填写付款事由、收款方、金额、时间及关联业务，提供适用依据","有合同则关联D07已确认合同及本次付款条件；无合同时核对订单、账单等依据","按付款类型确认预付条件、到期账单或本次交付验收事实，说明申请金额依据","负责人按授权规则批准本次付款申请；财务核对重复事项、资料、收款信息和历史已付金额","按实际结果登记全部或部分支付，保留凭据、失败原因及剩余应付","向申请人反馈支付结果，关联财务核算资料；补件、退款或更正保留原记录关系"],"states":"草稿/待确认 → 待批准 → 待财务核对 → 待支付 → 部分已付/已付；资料补正、退款及会计状态独立记录。","rules":["付款申请金额、批准金额、实际支付和剩余应付分别记录；已批准不等于已付款","合同是可关联依据，不是所有付款的必填前置；无合同仍须有经确认的订单、账单或其他真实业务依据","同一合同可对应多笔付款申请，各次引用适用版本和条件；合同金额、本次应付及累计实付分别核对","本次累计支付受批准金额和未付范围约束，预付按其适用依据确认，不强制先完成交付验收","同一业务在报销、借款及付款中关联核对，避免重复支付；员工已垫付费用走D01，借款备用金走D02，薪酬通过对应专业批次办理","实际支付以真实凭据和核对结果为准；重复提交或结果回传不重复增加资金支出"],"exceptions":["缺少适用依据或金额不清：明确缺项并退回对应经办人补正，不因无正式合同自动创建D07","收款方、账户、金额或关键付款条件变更：重新确认受影响授权并留版本","付款条件未满足：显示待确认；预付款按约定条件核对，不套用验收后的结算规则","支付失败、重复凭据或部分成功：逐项跟踪，成功部分不重复支付"],"outputs":["付款申请与应付台账","实际支付、剩余应付及补件/退款记录","原始依据、合同（如有）和会计处理关系"],"acceptance":["仅有经确认订单或服务账单的付款可以提交，不强制先创建D07合同","有合同的申请能引用D07，合同详情与付款记录可以相互追溯，一份合同允许多次申请","批准18000元、实付6000元时显示剩余12000元；批准未付不显示已付款","同一笔实际支付重复回传不再次扣减余额；员工垫付费用不会同时通过报销和付款重复支付","预付款按适用付款条件核对，所有记录能追到实际依据、确认人与支付结果"],"related":["D07","F05","F06"],"demo":true,"category":"office","initiator":"获授权业务经办人从“日常办公工作台”发起付款申请。","employee":"提供订单、账单或适用合同及交付依据，补件并查看本人经办事项的支付结果。","operator":"负责人批准；财务核对付款依据、收款方、历史已付及本次金额，记录实付与剩余应付。","entry":"日常办公工作台发起；财务工作台办理","workbench":"office","center":"business"},{"id":"D04","name":"员工请假","domain":"hr","kind":"核心","goal":"让员工提交请假、负责人确认安排、人事记录实际假勤结果。","trigger":"员工需要休假或修改已提出的请假安排。","actors":"员工提出；指定负责人审批；人事核对类型、时长及实际使用；薪酬环节按授权取得确认结果。","fields":["申请人、假期类型、开始/结束时间、工作日历、申请时长、原因摘要、批准时长、实际使用、关联交接"],"materials":["本人申请","必要证明（按企业规则）","审批和实际使用确认"],"steps":["员工说明时间、类型及必要事项","按工作日历核对时长和冲突","负责人确认工作安排并决定","人事核对实际使用、撤销或变更","形成确认假勤，衔接对应薪酬周期"],"states":"草稿 → 待批准 → 已批准待使用 → 已确认/已取消。","rules":["申请、批准和实际使用时长分别记录","不凭假期名称自动推断扣薪金额","证明资料按需采集、按权限使用"],"exceptions":["时间冲突：提示具体重叠","假期取消或缩短：记录实际使用","审批后跨期：保留所属期间与薪酬处理依据"],"outputs":["请假与假勤台账","审批和更正记录","薪酬所需确认资料"],"acceptance":["批准后未使用不直接计入实际假勤","半天等时长按企业日历定义","员工能看本人进度，人事可确认实际时长"],"related":["D05","H03"],"demo":false,"category":"office","initiator":"员工提出请假或修改本人安排。","employee":"确认时间、类型及交接，补充资料并反馈实际使用。","operator":"负责人确认工作安排；人事核对时长与周期结果，薪酬仅引用确认资料。","entry":"日常办公工作台发起；人事行政工作台为主办理，相关负责人及财务按任务协同","workbench":"office","center":"business"},{"id":"D05","name":"加班、调休与考勤确认","domain":"hr","kind":"常用","goal":"在同一办理入口处理加班、调休和考勤异常，形成有来源、可核对的周期假勤结果。","trigger":"员工申请加班或 function analysisChat(){const d=figures();return `<div class="analysis-layout"><section class="panel analysis-chat"><div class="panel-head"><div class="flex"><span class="bot-icon">${I('chat')}</span><div><b>小赢 · 经营分析助手</b><p class="tiny muted">连续追问 · 期间 ${E(S.analysis.period)} · ${S.analysis.basis==='paid'?'实际付款':S.analysis.basis==='expense'?'会计费用':'口径待确认'}</p></div></div>${TAG('B02','green')}</div><div class="chat-stream"><div class="answer"><b>小赢</b><p>可以问我本月支出变化、人员成本、还有哪些款没付，或入职对人数的影响。每个回答都附口径、时点与来源。</p></div>${S.analysis.messages.map(m=>m.by==='user'?`<div class="bubble user">${E(m.text)}</div>`:`<div class="answer"><b>小赢</b><p>${E(m.text).replace(/\n/g,'<br>')}</p>${m.clarify?`<div class="flex wrap">${BTN('按实际付款看','ask','按实际付款看','small')}${BTN('按会计费用看','ask','按会计费用看','small')}</div>`:''}${m.sources?`<div class="sources">${m.sources.map(([name,key])=>LINK(name,'analysis-source',key)).join('')}</div>`:''}<div class="source-note">${E(m.basis||'请先确认分析口径。')}</div></div>`).join('')}</div><div class="phone-compose"><div class="quick">${['本月支出比上月多在哪里？','人员相关占多少？','哪些费用还没付？','目前可用现金有多少？'].map(q=>`<button type="button" data-act="ask" data-id="${q}">${q}</button>`).join('')}</div><form id="analysis-chat" class="compose"><input name="question" aria-label="向小赢提问经营分析" placeholder="继续追问，沿用当前期间和口径…" required><button type="submit" class="btn primary">发送</button></form></div></section><aside class="stack">${PANEL('本轮分析范围',GRID([['主体','云帆创新 · 单主体示例'],['期间',S.analysis.period],['口径',S.analysis.basis==='paid'?'实际付款':S.analysis.basis==='expense'?'会计费用':'需要澄清时再确认'],['数据时点','2026.11.14；本机新增结果同步']]))}${PANEL('能核对的结果',`<p class="small">可用资金 <b class="amount">${MONEY(d.available)}</b></p><p class="small">已确认在职 <b>${d.inStaff} 人</b></p><p class="small muted">正式利润来自已结账财务结果，不能以到账金额代替收入。未知问题和数据缺口会明确说明，不模拟自由生成答案。</p>${BTN('回到现金流总览','cash','','small')}`)}${PANEL('跟进事项',S.actions.length?S.actions.map((a,i)=>`<div class="task-row"><div><b class="small">${E(a.title)}</b><p>${a.done?'已核对完成':'待责任人核对'}</p></div>${!a.done?BTN('完成','action-done',String(i),'small'):TAG('已完成','green')}</div>`).join(''):'<p class="small muted">只有经确认的跟进才会加入，不自动付款、调薪或对外通知。</p>')}</aside></div>`}
function answer(question,commit=true){if(!['owner','finance'].includes(S.actor))return toast('当前身份没有企业级经营分析权限。');const q=question.trim();if(!q)return;S.analysis.messages.push({by:'user',text:q});const d=figures();let text='',sources=[],clarify=false;const base='云帆创新 · '+S.analysis.period+' · 2026.11.14样例及本机新增事件。';if(/实际付款|现金支出/.test(q))S.analysis.basis='paid';else if(/会计费用|按费用/.test(q))S.analysis.basis='expense';if(/本月|上月|人员|占多少|支出|费用|多在哪里/.test(q)&&!S.analysis.basis&&!/没付|未付/.test(q)){S.analysis.pending=q;clarify=true;text='“支出”可能指实际付款，也可能指会计费用。你希望先按哪个口径看？确认后，后续追问会沿用同一期间和口径。';}else if(/人员|薪酬|占多少|人工/.test(q)){const total=S.analysis.basis==='paid'?d.paidMonth:d.expenseMonth,person=S.analysis.basis==='paid'?d.peoplePaid:d.peopleExpense;text=`沿用 ${S.analysis.period} 的${S.analysis.basis==='paid'?'实际付款':'会计费用'}口径，人员相关为 ${MONEY(person)}，占本月合计 ${MONEY(total)} 的 ${(person/total*100).toFixed(1)}%。\n工资、相关缴费与应发/实付分开核对；当前展示授权汇总，不展开个人工资。`;sources=[['薪酬确认汇总','payroll'],['指标口径与来源','metrics']];}else if(/没付|未付|待付|合同款/.test(q)){text=`目前已确认未付合计 ${MONEY(d.unpaid)}：基础办公及服务款 ${MONEY(3200000)}，本笔报销 ${MONEY(remaining(S.expense))}，本笔付款申请 ${MONEY(remaining(S.payment))}。\n未批准申请不并入已确认未付，已付部分不再次累计。`;sources=[['未付来源清单','payable'],['付款申请','payment']];}else if(/现金|可用|资金|回款|7天/.test(q)){text=`现有可用资金 ${MONEY(d.available)}，来自账面余额 ${MONEY(d.book)} 减受限资金 ${MONEY(d.restricted)}。\n未来7天已确认待付 ${MONEY(d.unpaid)}，预计¥40,000若按期到账，条件结果为 ${MONEY(d.available-d.unpaid+4000000)}；若延期则为 ${MONEY(d.available-d.unpaid)}。预计回款不计入现在可用资金。`;sources=[['B01现金流总览','cash'],['账户余额及受限依据','account']];}else if(/人数|入职|在职/.test(q)){text=`当前已确认在职 ${d.inStaff} 人。${S.join.created&&!S.join.active?'陈晨仍为拟入职或准备中，不能因为清单完成就加入在职人数。':S.join.active?'陈晨已确认实际入职，花名册与人员统计同步更新。':'目前没有新增已生效入职记录。'}\n这里统计的是人员生效事实，不是流程已办数量。`;sources=[['员工花名册','people']];}else if(/本月|上月|费用|支出|多在哪里|按实际付款|按会计费用/.test(q)){const isPaid=S.analysis.basis==='paid',current=isPaid?d.paidMonth:d.expenseMonth,previous=isPaid?d.previousPaid:d.previousExpense;const extra= current-(isPaid?4100000:4800000);text=`按 ${isPaid?'实际付款':'会计费用'}口径，本月 ${MONEY(current)}，上月 ${MONEY(previous)}，增加 ${MONEY(current-previous)}（${((current-previous)/previous*100).toFixed(1)}%）。\n基准样例的主要增加项为人员及行政服务；本机新增业务本月增加 ${MONEY(extra)}。可以继续问人员相关占比，或打开明细核对。\n样例提供的是金额构成；尚未核实的经营原因不会写成已证实结论。`;sources=[['费用 / 付款明细','metrics'],['本笔报销','expense'],['付款申请','payment']];}else{text='当前样例可分析现金流、实际付款、已确认费用、人员汇总和未结款项。这个问题缺少可核对资料，暂不能给出确定结论。可以先明确期间、对象或需要补充的数据。';sources=[['现有数据范围','metrics']];}S.analysis.messages.push({by:'assistant',text,clarify,sources,basis:base+(clarify?'口径待确认。':S.analysis.basis==='paid'?'实际付款不等于会计费用。':'来源和确认状态可回查；本机未过账业务不计入会计费用样例。')});if(!clarify)S.analysis.pending=null;if(commit){S.analysisTab='assistant';S.center='analysis';save();render();}}
function management(){if(!['sysadmin','finance'].includes(S.actor))return HEADING('后台管理','配置、基础资料和权限由获授权人员维护，不作为普通员工的必经入口。')+PANEL('当前权限范围',`<div class="notice">当前身份：${PERSONAS[S.actor].name} · ${PERSONAS[S.actor].title}。可办理其业务，但不能自动发布系统规则或修改数据权限。</div>${BTN('切换系统管理员演示','handoff','sysadmin','small')}`);return HEADING('后台管理','流程配置、台账与专业规则、基础资料和权限分别管理。修改配置不重写在途业务。',TAG('已发布模板 v'+S.config.version,'green'))+`<div class="two">${PANEL('报销流程模板',`<form id="config-form" class="stack">${FIELD('负责人追加批准条件（元）','threshold',S.config.threshold/100,'number','min="0" step="0.01" required')}<label class="check"><input name="requireFolio" type="checkbox" ${S.config.requireFolio?'checked':''}><span>酒店费用需补充住宿明细</span></label><div class="field"><label for="expense-subject">费用确认科目 · 专业规则示例</label><select id="expense-subject" name="subject" ${canFinance()?'':'disabled'}><option ${S.config.expenseSubject==='管理费用—差旅费'?'selected':''}>管理费用—差旅费</option><option ${S.config.expenseSubject==='销售费用—差旅费'?'selected':''}>销售费用—差旅费</option></select></div><div class="notice">新版本用于新提交业务；在途报销继续引用其提交时版本。科目示例仅供授权财务确认。</div><button type="submit" class="btn primary">确认并发布新版本</button></form>`)}${PANEL('台账规则与基础资料',TABLE(['映射 / 资料','执行规则'],[['票据金额 → 报销明细','提取值待核对，明细精确求和'],['实际入职日 → 花名册','清单办齐不提前生效'],['实际支付 → 资金及未清余额','批准与实付分开，凭据防重'],['企业主体 / 科目 / 费用类型','单主体云帆创新；专业权限维护']]))}</div>`+PANEL('角色与数据权限 · 示例',TABLE(['角色','业务 / 任务','原始资料','敏感字段与专业操作'],[['员工','本人申请、本人任务','本人业务附件','不读取他人工资或企业资金汇总'],['财务','核对、资金及会计任务','授权财务资料','付款、科目、过账分别确认'],['人事','入离职、薪酬、劳动合同','授权员工材料','可核对薪酬和本人资料'],['行政','设备、账号、用印、证照','履职所需交接依据','不默认获得工资和身份原件'],['系统管理员','发布模板与配置','配置及授权留痕','不因可配置而自动读取工资']]))+PANEL('规则发布记录',auditHTML(6))}
function expenseDraft(text=SAMPLE){if(S.actor!=='employee')return toast('此示例由林悦发起，请从顶部切换员工演示身份。');if(S.expense.created&&!['draft','returned'].includes(S.expense.stage))return toast('当前业务已提交，可查询进度或由经办人退回补正。');const amounts=['高铁','酒店','打车'].map(label=>Number(text.match(new RegExp(label+'[^0-9]{0,3}([0-9]+(?:\\.[0-9]{1,2})?)'))?.[1]));if(amounts.some(v=>!Number.isFinite(v)||v<=0)){S.messages.push({by:'user',text},{by:'assistant',text:'请补充高铁、酒店、打车等具体费用及金额，或使用完整差旅示例。我会先让你核对，不补造缺失金额。'});change();return;}S.expense.lines=S.expense.lines.map((l,i)=>({...l,cents:Math.round(amounts[i]*100)}));S.expense.created=true;S.expense.raw=text;S.expense.docs=[...new Set([...S.expense.docs,'train','hotel','taxi'])];S.messages.push({by:'user',text},{by:'assistant',text:'已按你提供的3条费用整理，合计'+MONEY(expenseTotal())+'。原始表达和票据样例已保存，酒店还需补充住宿明细。请核对后提交。'});log('保存原始表达并生成报销草稿','业务中心形成可编辑草稿；数据中心保留原件与提取值');change('已生成报销草稿，金额按明细求和。')}

function submitExpense(){const e=S.expense,rule=e.route||S.config;if(S.actor!=='employee')return toast('请以林悦身份确认本人申请。');if(!e.created)return toast('先用对话整理一笔报销。');if(!['draft','returned'].includes(e.stage))return toast('这笔报销已经提交，无需重复提交。');if(rule.requireFolio&&!e.docs.includes('folio'))return openModal('还缺一份必要依据',`<div class="notice warn">酒店发票已收到，本企业模板还要求住宿明细。补充明细仅作为原酒店费用依据，不再增加金额。</div>`,BTN('继续核对','close')+BTN('加入示例住宿明细','add-folio','','primary'));openModal('提交报销前确认',GRID([['申请金额',MONEY(expenseTotal())],['申请人','林悦'],['规则版本','差旅报销模板 v'+rule.version],['办理路径','主管'+(expenseTotal()>rule.threshold?' → 负责人':'')+' → 财务核对 → 实际付款']])+CHECK('submit-check','已核对费用事实、金额、收款信息及适用资料'),BTN('返回修改','close')+BTN('确认提交','confirm-expense','','primary'))}

if(a==='catalog')return catalogModal();if(a==='requirement')return requirementModal(id);if(a==='payroll'){if(!['hr','finance','owner'].includes(S.actor))return toast('当前身份没有薪酬资料访问权限。');closeModal();return navigate('business','payroll',S.wb==='office'?'people':S.wb)}if(a==='invoices')return invoices();if(a==='reports'){closeModal();return reports()}
if(a==='asset-request')return genericRequest('asset');if(a==='leave-request')return genericRequest('leave');if(a==='request-approve'){const r=S.requests.find(x=>x.id===id);if(S.actor!=='manager'||r?.stage!=='approval')return toast('当前无审批任务。');r.stage='handling';log('批准日常申请',r.id+'，实际使用或发放待确认');closeModal();return change('申请已批准，等待实际结果。')}
if(a==='request-finish'){const r=S.requests.find(x=>x.id===id);if(!r||S.actor!==(r.type==='leave'?'hr':'facilities'))return toast('当前身份不是实际办理人。');r.stage='done';log('确认日常实际结果',r.id+' · '+(r.type==='leave'?'实际假勤已核对':'实际物品交付已核对'));closeModal();return change('实际结果已确认并留痕。')}
if(a==='contract'||a==='contracts')return contractModal();if(a==='licenses')return openModal('企业证照 · A03',TABLE(['资料','有效状态','保管与办理'],[['企业主体资料（示例）','已核对原件版本','行政授权范围'],['品牌授权文件（示例）','2026-12-31到期','到期需由责任人确认办理，提醒不等于已续期']])+`<div class="notice">证照原件及对外共享按角色和用途授权；外部办理需真实回执。</div>`);
if(a==='analysis-tab'){S.analysisTab=id;return change()}if(a==='cash'){closeModal();return navigateAnalysis('cash')}if(a==='assistant'){closeModal();return navigateAnalysis('assistant')}if(a==='ask'){closeModal();return answer(id)}if(a==='analysis-source')return analysisSource(id);if(a==='baseline-source')return baselineSource(id);
if(a==='followup'){openModal('确认跟进事项',`<p class="small">${E(id)}</p><div class="notice">创建内部待办草稿，不自动发送外部通知或改变付款安排。</div>`,BTN('取消','close')+BTN('确认加入待办','confirm-followup',id,'primary'));return}if(a==='confirm-followup'){if(!S.actions.some(x=>x.title===id&&!x.done))S.actions.push({title:id,done:false});log('确认经营跟进事项',id);closeModal();return change('已加入待核对事项。')}if(a==='action-done'){if(S.actions[+id])S.actions[+id].done=true;return change('跟进状态已更新。')}
if(a==='go-data'||a==='join-data'){closeModal();S.dataTab='raw';return navigate('data')}if(a==='go-ledger'||a==='people-ledger'){closeModal();S.dataTab='ledger';S.ledger=id||'people';return navigate('data')}if(a==='go-workflow'){closeModal();S.taskTab='all';return navigate('workflow')}if(a==='go-analysis'){closeModal();return navigateAnalysis('cash')}if(a==='go-management'){closeModal();return navigate('management')}
if(a==='reset')return openModal('重置本机演示进度',`<p class="small">将清除本原型中的示例申请、办理结果和对话，恢复初始样例。</p>`,BTN('保留进度','close')+BTN('确认重置','confirm-reset','','danger'));
if(a==='confirm-reset'){S=fresh();closeModal();return change('已恢复初始样例。')}
if(a==='newhire-material'){S.join.submitted=true;log('员工提交本人入职材料',S.join.name+'，等待人事核对字段与原件');return change('资料已提交，人事核对与正式生效分别办理。')}
if(a==='newhire-sign'){S.join.employeeSigned=true;log('员工回填本人签署结果',S.join.name+'，待人事核对签署版本');return change('签署结果已提交，待人事核对。')}
});
document.addEventListener('submit',event=>{const f=event.target;if(!f.id)return;event.preventDefault();const data=new FormData(f),value=n=>String(data.get(n)||'').trim();if(f.id==='employee-chat'){const t=value('text');f.reset();return sendEmployee(t)}if(f.id==='analysis-chat'){const t=value('question');f.reset();return answer(t)}if(f.id==='transcript-form'){const text=value('text');if(!text)return;closeModal();return expenseDraft(text)}
if(f.id==='expense-form'){const lines=S.expense.lines.map((l,i)=>({...l,cents:Math.round(Number(value('line'+i))*100)}));if(lines.some(l=>!Number.isSafeInteger(l.cents)||l.cents<=0))return toast('请填写有效的正数金额。');S.expense.reason=value('reason');S.expense.date=value('date');S.expense.lines=lines;S.expense.revision++;log('员工核对修改草稿','保留原始表达与资料，第'+S.expense.revision+'版');closeModal();return change('已保存核对结果。')}
if(f.id==='return-form'){const reason=value('reason');if(!reason)return;S.expense.returnReason=reason;S.expense.stage='returned';S.expense.revision++;log('退回员工补正',reason);S.messages.push({by:'assistant',text:'报销需补正：'+reason+'。原资料及意见保留，修改后可以重提。'});closeModal();return change('已退回补正并反馈员工。')}
if(f.id==='join-form'){if(!canHR())return toast('当前无入职发起权限。');Object.assign(S.join,{created:true,name:value('name'),job:value('job'),team:value('team'),date:value('date')});log('人事发起入职',S.join.name+' · '+S.join.date+'，生成跨岗清单');closeModal();change('入职清单已生成。');return joinModal()}
if(f.id==='join-change-form'){S.join.date=value('date');S.join.cancelled=data.get('cancelled')==='on';log('调整入职安排',S.join.cancelled?'已取消，需核对准备事项的回收':'拟入职日调整为'+S.join.date);closeModal();return change('入职安排已更新，已有准备结果仍保留。')}
if(f.id==='payment-form'){const amount=Math.round(Number(value('amount'))*100);if(!Number.isSafeInteger(amount)||amount<=0)return toast('申请金额必须为有效正数。');if(value('contract')&&amount>1800000)return toast('本合同本阶段已确认可申请18,000元，请核对累计及结算依据。');Object.assign(S.payment,{created:true,reason:value('reason'),vendor:value('vendor'),amount,due:value('due'),contract:value('contract'),basis:value('basis'),requester:S.actor});log('生成付款申请草稿',S.payment.id+' · '+MONEY(amount)+'，合同按需关联');closeModal();change('付款草稿已保存，请核对后提交。');return paymentModal()}
if(f.id==='pay-form'){if(!canFinance()||!$('#pay-check')?.checked)return toast('请以财务身份核对实际付款结果。');const r=f.dataset.kind==='expense'?S.expense:S.payment,cents=Math.round(Number(value('amount'))*100),ref=value('ref');if(!Number.isSafeInteger(cents)||cents<=0||cents>remaining(r))return toast('本次金额须大于0且不超过已批准未付余额。');if([...S.expense.payments,...S.payment.payments].some(p=>p.ref===ref))return toast('该付款凭据已登记，请勿重复记支出。');r.payments.push({cents,ref,date:value('date')});if(f.dataset.kind==='expense'&&remaining(r)===0)r.stage='payment';log('登记实际付款结果',r.id+' · '+MONEY(cents)+' · '+ref);closeModal();change('已记录实际支付，剩余应付自动核对。');return recordModal(f.dataset.kind)}
if(f.id==='config-form'){if(!['sysadmin','finance'].includes(S.actor))return toast('当前没有规则发布权限。');const amount=Math.round(Number(value('threshold'))*100);if(!Number.isSafeInteger(amount)||amount<0)return toast('请填写有效阈值。');S.config.threshold=amount;S.config.requireFolio=data.get('requireFolio')==='on';if(canFinance()&&S.config.expenseSubject!==value('subject')){S.config.expenseSubject=value('subject');S.config.accountingVersion=(S.config.accountingVersion||1)+1;}S.config.version++;log('发布配置新版本','模板 v'+S.config.version+'；在途报销继续使用其原版本');return change('新版本已发布，在途记录未被改写。')}
if(f.id==='request-form'){S.requests=S.requests||[];S.requests.push({id:'SQ-'+String(S.requests.length+1).padStart(3,'0'),type:f.dataset.kind,reason:value('reason'),item:value('item'),date:value('date'),quantity:Number(value('quantity')),stage:'approval'});log('发起日常申请',S.requests.at(-1).id+' · '+S.requests.at(-1).reason);closeModal();return change('申请已提交给负责人，实际结果另行确认。')}
});
document.addEventListener('change',event=>{if(event.target.id==='persona'){S.actor=event.target.value;S.view='home';save();render()}});
$('#modal').addEventListener('cancel',()=>clearInterval(recordTimer));

function canRecord(kind){if(kind?.startsWith('request:'))return S.actor!=='sysadmin'&&S.actor!=='newhire';if(kind==='expense')return ['employee','manager','finance','owner'].includes(S.actor);if(kind==='payment')return ['manager','finance','owner'].includes(S.actor)||S.actor===(S.payment.requester||'employee');if(kind==='join')return ['hr','facilities','newhire','owner','manager'].includes(S.actor);return false}
function newHireOffice(){const j=S.join;return `<div class="office-layout"><section class="phone"><div class="phone-status"><span>09:41</span><span>5G ▰</span></div><div class="phone-head"><div class="flex"><span class="bot-icon">${I('chat')}</span><div><strong>小赢</strong><small>${E(j.name)} · 本人入职事项</small></div></div>${TAG('本人授权','green')}</div><div class="chat-stream"><div class="bubble">你好${E(j.name)}，可以在这里补交本人入职资料和查看签署、交接任务。人事会核对资料，并按实际入职日确认生效。</div>${j.created?`<div class="chat-card"><div class="chat-card-head"><b>我的入职事项</b>${stateTag(joinStatus())}</div><div class="chat-card-body">${GRID([['岗位',E(j.job)],['拟入职日',j.date]])}<div class="notice">${j.submitted?'本人资料已提交，待人事核对':'本人资料尚待补交'}</div>${BTN(j.submitted?'已提交本人材料':'提交示例本人材料','newhire-material','','primary')}${BTN(j.employeeSigned?'已提供签署结果':'提交本人签署结果','newhire-sign')}${LINK('查看本人原件','doc','join-material')}${BTN('查看办理清单','open-record','join','small')}</div></div>`:'<div class="notice">还没有人事发起的入职事项。</div>'}</div><div class="phone-compose"><div class="phone-foot">材料、签署和人员生效分别记录 · 不展示他人资料</div></div></section><aside class="office-intro">${PANEL('本人参与，不替代专业确认','<p class="small muted">员工提交原始资料，人事核对必要字段。行政办理设备账号，实际结果回到同一清单；准备办齐不会提前加入在职人数。</p>')}${BTN('切换人事继续核对','handoff','hr','small')}</aside></div>`}
if(EMBED)seedEmbedded(EMBED);render();if(EMBED?.open==='expense')expenseModal();if(EMBED?.open==='join')joinModal();if(EMBED?.open==='payment')paymentModal();
</script></body></html>
