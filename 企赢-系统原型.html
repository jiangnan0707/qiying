 <aside class="mobile-summary"><div class="summary-box"><h3>这笔业务的当前状态</h3><div class="status-line"><span class="muted">业务进度</span><span class="tag ${e.stage==='done'?'green':'amber'}">${stageLabel()}</span></div><div class="status-line"><span class="muted">审批</span><b>${e.created?reviewLabel():'—'}</b></div><div class="status-line"><span class="muted">付款</span><b>${e.paid?'已登记':'未付款'}</b></div><div class="status-line"><span class="muted">核算</span><b>${e.posted?'已过账':'未过账'}</b></div><div class="divider"></div><p class="progress-note">手机端和 PC 端共享同一笔业务。切换角色后，专业人员处理的结果会回到员工对话中。</p>${e.created?`<button type="button" class="btn" data-action="${canEdit()?'submit':'go-next'}">${canEdit()?'核对并提交报销':e.stage==='done'?'查看财务处理结果':`切换到${actors[nextRole()].work}`} ${icon('arrow',15)}</button>`:''}</div><p class="tiny muted">这是浏览器内交互原型，所有资料与交易均为演示。角色切换用于评审，不代表真实系统的权限验证。</p></aside></div>`;
}

function dataDetail(){const e=state.expense;return `<dl class="data-grid"><div><dt>申请人 / 所属团队</dt><dd>林悦 / 项目交付组</dd></div><div><dt>业务日期</dt><dd>${esc(e.fields.date)}</dd></div><div><dt>归属项目</dt><dd>${esc(e.fields.project||'待归集')}</dd></div><div><dt>费用类型</dt><dd>国内差旅</dd></div><div class="full"><dt>报销事由</dt><dd>${esc(e.fields.reason)}</dd></div></dl><div><div class="subheading">费用明细 <span class="tiny muted">· 金额由明细求和</span></div><div class="table-wrap"><table><thead><tr><th>费用</th><th>原始依据</th><th class="money">申请金额</th></tr></thead><tbody>${e.fields.lines.map(l=>`<tr><td>${esc(l.name)}</td><td><button type="button" class="source-btn" data-action="source" data-type="${l.type}">${attachmentTypes[l.type]} ↗</button><small>原始票据 / 员工确认</small></td><td class="money mono">¥${money(l.cents)}</td></tr>`).join('')}<tr><td colspan="2"><b>合计</b></td><td class="money mono"><b>¥${money(total())}</b></td></tr></tbody></table></div></div><div><div class="subheading">本笔处理路径 <span class="tag">规则 v${(e.route||state.config).version}</span></div><div class="stepper">${flowSteps()}</div></div>${e.returnReason&&e.stage==='returned'?`<div class="notice danger">退回原因：${esc(e.returnReason)}</div>`:''}<div class="notice neutral">原始表达：${esc(e.raw)}<br>字段由员工确认；AI 整理不替代业务真实性与票据核对。</div>`;}
function flowSteps(){const e=state.expense;let sequence=[['employee','员工确认'],['manager','主管审批']];if(total()>(e.route||state.config).threshold)sequence.push(['boss','老板审批']);sequence.push(['finance','财务复核'],['payment','付款登记'],['accounting','会计复核']);let index=e.stage==='done'?sequence.length:sequence.findIndex(([id])=>id===e.stage);if(['draft','returned'].includes(e.stage))index=0;return sequence.map(([id,title],i)=>`<div class="flow-step ${i<index?'done':i===index?'current':''}"><i>${i<index?'✓':i+1}</i><span>${title}</span></div>`).join('');}
function filesDetail(){const e=state.expense;return `<div class="notice warn">样例材料用于验证交互。未接通税务查验；“材料已齐”不等于“发票已验真”。</div>${attachmentButtons()}<p class="small muted">每份资料关联同一个业务编号，保留来源和上传记录。真实系统应保存原文件，本原型只记录文件名称与类型。</p>`;}
function checksDetail(){const e=state.expense;let checks=[['必需资料',missing().length?'材料缺失':'四类资料齐全',missing().length?'amber':'green','高铁、酒店、打车票据与住宿明细'],['金额合计',`¥${money(total())}`,'green','按分为单位求和，避免显示与计算误差'],['项目归属',e.fields.project?'已确认':'待归集',e.fields.project?'green':'amber','员工确认业务归属'],['跨单重复检测','未接入真实单据库','amber','原型只约束同一业务不重复提交、付款或过账'],['税务平台查验','待人工核验','amber','未连接税务接口，不将识别结果标为验真'],['审批路径',`规则 v${(e.route||state.config).version}`,'blue',routeText()]];return `<div class="check-list">${checks.map(([name,value,color,note])=>`<div class="check-item"><div><b>${name}</b><small>${note}</small></div><span class="tag ${color}">${value}</span></div>`).join('')}</div><div class="notice neutral">固定规则负责金额、权限与审批路径；AI 负责资料理解与疑点说明。真实业务中的语义审核和跨单检测将在接入后验证。</div>`;}
function historyDetail(){return `<div class="timeline">${[...state.expense.events].reverse().map(ev=>`<div class="event"><div class="event-dot"><i></i></div><div><h4>${esc(ev.title)}</h4><p>${esc(ev.detail)}</p><p>${esc(ev.actor)} · 本机时间 ${ev.time}</p></div></div>`).join('')}</div>`;}
function detailActions(){const e=state.expense;if(pendingForRole()){const isFinance=state.role==='finance';return `<div class="detail-actions">${isFinance?'<label class="check"><input id="finance-check" type="checkbox">我已核对本例票据与业务依据，示例金额与资料匹配（演示）</label>':''}<div class="action-row"><span class="tiny muted">${isFinance?'复核通过后形成待付款，不自动执行支付。':'审批仅表达同意；后续仍需财务复核与实际付款。'}</span><div class="flex"><button type="button" class="btn danger" data-action="return">退回补正</button><button type="button" class="btn primary" data-action="approve">${isFinance?'复核通过':state.role==='boss'?'老板批准':'主管同意'}</button></div></div></div>`;}
 if(state.role==='finance'&&e.stage==='payment')return `<div class="detail-actions"><div class="action-row"><span class="tiny muted">已批准，尚未登记付款。</span><button type="button" class="btn primary" data-view="payment">办理付款登记 ${icon('arrow',15)}</button></div></div>`;
 if(state.role==='finance'&&['accounting','done'].includes(e.stage))return `<div class="detail-actions"><div class="action-row"><span class="tiny muted">${e.posted?'已完成会计处理，原记录保留。':'付款已登记，凭证草稿待会计复核。'}</span><button type="button" class="btn" data-view="voucher">查看凭证 ${icon('arrow',15)}</button></div></div>`;
 return `<div class="detail-actions"><span class="small muted">${e.stage==='done'?'本笔业务已办理完成。':'当前环节不需要你处理。'}${e.stage==='boss'?'本笔金额需要老板批准。':''}</span></div>`;
}
function ledgerView(){const e=state.expense;return heading('报销台账','同一份业务记录从草稿开始追踪，审批、付款与核算各自保留状态。',`<button type="button" class="btn" data-action="export" ${e.created?'':'disabled'}>导出台账 CSV</button>`)+`<div class="panel"><div class="panel-head"><h3>全部报销</h3><span class="tag">${e.created?1:0} 笔</span></div>${e.created?`<div class="table-wrap wide"><table><thead><tr><th>业务编号 / 申请人</th><th>项目</th><th class="money">申请 / 批准金额</th><th>审批</th><th>付款</th><th>核算</th><th>操作</th></tr></thead><tbody><tr><td><span class="mono tiny">${e.id}</span><small>林悦 · 第 ${e.revision} 版</small></td><td>${esc(e.fields.project||'待归集')}</td><td class="money mono">¥${money(total())}<small>${e.reviewApproved?'批准 ¥'+money(total()):'批准金额尚未确定'}</small></td><td>${reviewLabel()}</td><td>${e.paid?'已登记':'未付款'}</td><td>${e.posted?'已过账':e.paid?'草稿':'未处理'}</td><td><button type="button" class="source-btn" data-action="show-detail">查看</button></td></tr></tbody></table></div>`:empty('台账尚无记录','先从员工移动端创建草稿。',true)}</div>${e.created?detailPanel():''}`;}
function paymentView(){const e=state.expense;return heading('付款管理','依据批准单办理付款，按实际支付结果登记；本原型不发起真实转账。')+`<div class="metrics"><div class="metric"><span>待付款</span><strong>¥${money(e.reviewApproved&&!e.paid?total():0)}</strong><small>批准且未登记付款</small></div><div class="metric"><span>已登记付款</span><strong>¥${money(e.paid?total():0)}</strong><small>本原型中的演示记录</small></div><div class="metric"><span>付款状态</span><strong style="font-family:inherit;font-size:22px">${e.paid?'已登记':e.reviewApproved?'待登记':'待审批通过'}</strong><small>批准与支付事实分开记录</small></div></div><div class="panel">${!e.reviewApproved?empty('暂无可付款单据','完成主管 / 老板审批和财务复核后，才能登记付款。'):e.paid?`<div class="panel-head"><h3>付款登记记录</h3><span class="tag green">已登记 · 演示</span></div><div class="payment-summary"><dl class="data-grid"><div><dt>关联业务</dt><dd class="mono">${e.id}</dd></div><div><dt>收款人</dt><dd>林悦</dd></div><div><dt>实际登记金额</dt><dd class="mono">¥${money(total())}</dd></div><div><dt>付款日期</dt><dd>${esc(e.payment.date)}</dd></div><div class="full"><dt>付款凭据编号</dt><dd>${esc(e.payment.reference)}</dd></div></dl><div class="notice neutral">该记录是演示付款事实，不是银行回执。重复点击不会生成第二笔付款。</div><div><button type="button" class="btn primary" data-view="voucher">查看凭证草稿 ${icon('arrow',15)}</button></div></div>`:`<div class="panel-head"><h3>待付款任务</h3><span class="tag amber">1 笔</span></div><div class="payment-summary"><div class="between"><div><h2>林悦 · 差旅报销</h2><p class="small muted">${e.id} · ${esc(e.fields.project||'待归集')}</p></div><strong class="mono" style="font-size:28px">¥${money(total())}</strong></div><div class="notice">审批已完成，进入授权经办人付款环节。首期采用线下支付后登记结果的方式。</div><div><button type="button" class="btn primary" data-action="pay">登记实际付款</button></div></div>`}</div>`;}
function voucherView(){const e=state.expense;return heading('凭证草稿','固定核算规则生成示意草稿，会计确认科目与金额后演示过账。')+`<div class="panel">${!e.paid?empty('还没有可复核的凭证草稿','本例采用付款后直接确认费用的简化方式，先完成付款登记。'):`<div class="panel-head"><h3>${e.posted?'已过账凭证':'待复核草稿'}</h3><span class="tag ${e.posted?'green':'amber'}">${e.posted?'已过账 · 演示':'草稿 · 未过账'}</span></div><div class="voucher"><div class="voucher-title"><h2>记账凭证</h2><span class="tiny muted">${e.posted?'记－演示001':'草稿－001'} · 2026 年 11 月 · 关联 ${e.id}</span></div><div class="field"><label for="subject">费用归集科目</label><select id="subject" ${e.posted?'disabled':''}>${['管理费用－差旅费','销售费用－差旅费','研发支出－差旅费'].map(s=>`<option ${s===e.subject?'selected':''}>${s}</option>`).join('')}</select><small>科目选择仅作交互示意，实际由会计政策、业务事实和税额处理决定。</small></div><div class="table-wrap"><table><thead><tr><th>摘要</th><th>科目</th><th class="money">借方</th><th class="money">贷方</th></tr></thead><tbody><tr><td>林悦项目差旅</td><td>${esc(e.subject)}</td><td class="money mono">${money(total())}</td><td class="money">—</td></tr><tr><td>支付员工报销</td><td>银行存款</td><td class="money">—</td><td class="money mono">${money(total())}</td></tr><tr><td colspan="2"><b>合计</b></td><td class="money mono"><b>${money(total())}</b></td><td class="money mono"><b>${money(total())}</b></td></tr></tbody></table></div><div class="voucher-footer"><span>辅助归集：${esc(e.fields.project||'待归集')}</span><span>制单：规则生成 / 复核：陈晨</span></div><div class="notice warn">简化核算示意：本例不拆分税额。若费用已在批准时确认为应付款，付款时应结清应付，不能再次记入费用。</div><div class="flex wrap"><button type="button" class="btn small" data-action="show-detail">回溯业务单据</button><button type="button" class="btn small" data-action="history-modal">查看处理记录</button></div></div>${!e.posted?`<div class="detail-actions"><label class="check"><input type="checkbox" id="posting-check">我已复核核算依据、科目、金额及借贷平衡（演示）</label><div class="action-row"><span class="tiny muted">确认后更新核算状态，不产生真实账务。</span><button type="button" class="btn primary" data-action="post">确认过账 · 演示</button></div></div>`:'<div class="detail-actions"><span class="small muted">已完成演示过账；原始业务和凭据可继续追溯。本原型不模拟已过账冲销。</span></div>'}`}</div>`;}
function insightView(){const e=state.expense;const amount=e.created?total():0;return heading(state.role==='boss'?'经营概览':'费用概览','直接从业务台账看办理进度；核算结果单独标注。本页仅含一笔报销示例。')+`<div class="metrics"><div class="metric"><span>已批准费用 · 管理口径</span><strong>¥${money(e.reviewApproved?amount:0)}</strong><small>财务复核完成后计入</small></div><div class="metric"><span>实际登记支出</span><strong>¥${money(e.paid?amount:0)}</strong><small>来自付款登记记录</small></div><div class="metric"><span>已过账费用 · 示意</span><strong>¥${money(e.posted?amount:0)}</strong><small>来自已复核的演示凭证</small></div></div><div class="panel"><div class="panel-head"><h3>${esc(e.fields.project||'待归集')} · 费用处理进度</h3><span class="tag">单笔示例</span></div><div class="chart-summary">${[['申请金额',amount],['批准金额',e.reviewApproved?amount:0],['登记付款',e.paid?amount:0],['会计过账',e.posted?amount:0]].map(([name,value])=>`<div class="bar-row"><span>${name}</span><div class="bar-track"><div class="bar-fill" style="width:${value?100:0}%"></div></div><b class="mono">¥${money(value)}</b></div>`).join('')}<div class="notice neutral">四个数表示不同处理事实，不能相加作为总费用。完整财务报表依赖完整账务及结账，不由单笔报销直接生成。</div></div></div>`;}
function hrView(){return heading(state.view==='access'?'数据权限':'人力工作台','HR 关注组织和人员事务；本报销示例不向人力角色开放费用明细。')+`<div class="panel"><div class="role-lock"><div class="lock-icon">${icon('lock',28)}</div><div><span class="tag blue">按职责提供工作视图</span><h2 style="margin-top:13px">本角色没有报销数据访问权限</h2><p>当前报销由员工、主管 / 老板与财务处理。人力工作台不展示金额、票据、付款信息，也不把这些数据提供给人力助手。</p><p>未来可承接入职、请假与薪酬准备，使用共同的资料、流程和留痕能力，进入独立的人力专业台账。</p></div></div></div><div class="panel"><div class="panel-head"><h3>组织资料 · 示例</h3><span class="tag">只读</span></div><div class="table-wrap"><table><thead><tr><th>员工</th><th>所属团队</th><th>直属主管</th><th>状态</th></tr></thead><tbody><tr><td>林悦</td><td>项目交付组</td><td>周宁</td><td><span class="tag green">在职</span></td></tr></tbody></table></div></div><div class="notice neutral">原型通过角色切换演示可见性，所有演示数据仍在浏览器内；生产环境必须在服务端实施数据权限及隔离。</div>`;}
function configView(){const c=state.config,e=state.expense;return heading('流程配置','仅开放报销模板的少量参数；发布后只影响新提交的流程。')+`<div class="config-grid"><div class="panel"><div class="panel-head"><h3>差旅报销模板</h3><span class="tag blue">当前 v${c.version}</span></div><form id="config-form" class="config-body"><div class="field"><label for="threshold">超过此金额，增加老板审批（元）</label><input type="number" id="threshold" min="0" max="10000000" step="0.01" value="${c.threshold/100}" required><small>严格大于阈值触发；主管审批与财务复核固定保留。</small></div><label class="check"><input type="checkbox" id="require-project" ${c.projectRequired?'checked':''}>提交前必须确认项目归属</label><div class="notice neutral">配置只改变审批与必填条件，不改变核算政策，不允许绕过权限及付款控制。</div><div><button type="submit" class="btn primary">发布新版本 · 演示</button></div></form></div><div class="panel"><div class="panel-head"><h3>已发布规则的处理路径</h3></div><div class="config-body"><div class="route-chain"><span class="route-node">员工确认</span>→<span class="route-node">主管审批</span>→<span class="route-node">超 ¥${money(c.threshold)} 加老板</span>→<span class="route-node">财务复核</span></div><div class="notice ${e.route?'warn':'neutral'}">${e.route?`本笔业务已锁定 v${e.route.version}，阈值为 ¥${money(e.route.threshold)}。发布新版本不会修改它的审批路径。`:'员工提交时锁定规则版本。草稿提交前使用最新发布版本。'}</div><p class="small muted">本例金额为 ¥${money(total())}。若要演示老板审批，可在员工首次提交前把阈值改为 ¥1,000，再回到员工端确认提交。</p></div></div></div>`;}
function openModal(title,body,footer=''){modal.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button type="button" class="icon-button" data-action="close-modal" aria-label="关闭">${icon('close',16)}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}`;modal.showModal();}
function showReceipt(id){const a=state.expense.attachments.find(x=>x.id===id);if(!a)return;const l=state.expense.fields.lines.find(x=>x.type===a.type);openModal(attachmentTypes[a.type],`<div class="receipt"><h3>${a.sample?'演示材料 · 非真实发票':'原始文件索引'}</h3><dl><dt>材料类型</dt><dd>${attachmentTypes[a.type]}</dd><dt>文件名称</dt><dd>${esc(a.name)}</dd><dt>关联业务</dt><dd>${state.expense.id}</dd><dt>费用金额</dt><dd>${l?'¥'+money(l.cents):'住宿费用的补充证明'}</dd><dt>资料来源</dt><dd>${a.sample?'示例材料库':'本地选择文件，仅保存名称'}</dd><dt>查验状态</dt><dd>未接通税务平台查验</dd></dl></div><div class="notice neutral">${a.sample?'此材料仅说明字段来源与资料关系，不可用于报销或记账。':'本原型不存储或解析原文件，也不提供文件内容预览。实际系统应保存原件并提供核对。'}</div>`);}
function addSamples(folio=false){if(!canEdit()||!state.expense.created)return notify('请先在员工端发起报销；已提交单据须退回或撤回后修改。');let types=folio?['folio']:['train','hotel','taxi'];let count=0;types.forEach(type=>{if(!state.expense.attachments.some(a=>a.type===type)){state.expense.attachments.push({id:'sample-'+type,type,name:attachmentTypes[type]+'-示例.pdf',sample:true});count++;}});if(!count)return notify('这类材料已经存在，无需重复添加。');message(folio?'住宿明细已补充，关联到本笔报销。':'已收到高铁、酒店和打车票据。');message(missing().length?'还需补充'+missing().map(t=>attachmentTypes[t]).join('、')+'。':'必需材料已齐，请核对报销单并确认提交。');event('补充原始资料',types.map(t=>attachmentTypes[t]).join('、')+'（示例）','林悦');save();render();}
function sendText(text){text=text.trim();if(!text)return;if(text.length>2000)return notify('请将本次消息控制在 2,000 字以内。');message(text,'user');const e=state.expense;if(/进度|状态|到哪|怎么样/.test(text)){message(progressText());save();return render();}if(e.created&&!canEdit()){message('这笔报销正在办理中。可以查询进度；如需更改已提交资料，请先撤回，或由经办人退回补正。');save();return render();}const names=[['train','高铁'],['hotel','酒店'],['taxi','打车']];const extracted=names.map(([type,name])=>{const re=new RegExp(name+'(?:费)?[\\s：:¥￥]*([0-9]+(?:\\.[0-9]{1,2})?)(?![0-9.])');const match=text.match(re);return {type,name,cents:match?Math.round(Number(match[1])*100):null};});if(extracted.some(x=>x.cents===null||x.cents<=0||x.cents>100000000)){message('请补充本例支持的三项费用，例如“高铁286，酒店800，打车200”，并核对金额。其他费用类型暂未在这个原型中配置。');save();return render();}const wasCreated=e.created;e.created=true;e.raw=text;e.fields.lines=extracted;const statement=text.split(/[，,。]/)[0].replace(/^(上周|昨天|前天|今天|这周)/,'').trim();e.fields.reason=/高铁|酒店|打车/.test(statement)?'':statement;const project=text.match(/(?:给|为)([^，。\s]{1,20}?项目)/);e.fields.project=project?project[1]:'';message(`已整理三项费用，合计 ¥${money(total())}。\n${e.fields.project&&e.fields.reason?'项目和事由已放进草稿，请核对。':'项目或事由尚不明确，请点“核对 / 修改”补充。'}票据和住宿明细可以继续补充。`);event(wasCreated?'重新整理草稿':'创建报销草稿','保留原始表达；提取结果待员工确认。','林悦');save();render();}
function progressText(){const e=state.expense;return !e.created?'你还没有发起报销。把费用描述发给我，就可以开始整理。':`这笔报销${stageLabel()}。\n审批：${reviewLabel()}；付款：${e.paid?'已登记付款':'未付款'}；核算：${e.posted?'已过账':e.paid?'草稿待复核':'未处理'}。${e.stage==='returned'?'\n退回原因：'+e.returnReason:''}`;}
function editModal(){if(!canEdit())return;const e=state.expense;openModal('核对报销单',`<form id="edit-form" class="stack"><div class="form-grid"><div class="field full"><label for="edit-reason">报销事由</label><input id="edit-reason" maxlength="100" value="${esc(e.fields.reason)}" required></div><div class="field"><label for="edit-project">归属项目</label><input id="edit-project" maxlength="40" value="${esc(e.fields.project)}"></div><div class="field"><label for="edit-date">业务日期</label><input id="edit-date" type="date" value="${e.fields.date}" required></div>${e.fields.lines.map((l,i)=>`<div class="field"><label for="edit-line-${i}">${l.name}金额（元）</label><input type="number" id="edit-line-${i}" min="0.01" max="1000000" step="0.01" value="${l.cents/100}" required></div>`).join('')}</div><div class="notice neutral">字段经你确认后才提交。金额变化后请重新核对对应票据。原始资料与历史记录会保留。</div></form>`,`<button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" form="edit-form" class="btn primary">保存确认</button>`);}
function submitExpense(){const e=state.expense;if(!canEdit()||!e.created)return;if(missing().length){message('暂时还不能提交：请补充'+missing().map(t=>attachmentTypes[t]).join('、')+'。资料补齐后再确认。');save();render();return;}const r=e.route||state.config;if(!e.fields.reason.trim()||(r.projectRequired&&!e.fields.project.trim())){notify('请先确认报销事由与必填项目。');return editModal();}openModal('确认提交报销',`<p>将提交 <b>${esc(e.fields.project||'待归集')}</b> 的差旅报销，共 <b class="mono">¥${money(total())}</b>。</p><div class="notice neutral">${routeText()}<br>采用规则 v${r.version}，提交后锁定该版本。</div><label class="check"><input type="checkbox" id="employee-confirm">我已核对事由、项目、金额与所附材料（演示）</label>`,`<button type="button" class="btn" data-action="close-modal">再核对一下</button><button type="button" class="btn primary" data-action="confirm-submit">确认提交</button>`);}
function approve(){const e=state.expense;if(!pendingForRole())return notify('当前角色无此环节的待办。');if(state.role==='finance'&&!$('#finance-check')?.checked)return notify('请先勾选票据与业务依据核对确认。');if(state.role==='manager'){e.stage=total()>e.route.threshold?'boss':'finance';event('主管审批通过','同意本笔报销，下一步：'+(e.stage==='boss'?'老板审批':'财务复核'));message(`主管周宁已同意。接下来${e.stage==='boss'?'由老板审批':'由财务核对资料'}。`);}else if(state.role==='boss'){e.stage='finance';event('老板审批通过','金额超过流程阈值，老板确认同意。');message('老板已批准，接下来由财务复核。');}else {e.reviewApproved=true;e.stage='payment';event('财务复核通过',`批准金额 ¥${money(total())}；形成待付款任务，不自动支付。`);message(`财务复核已通过，批准金额 ¥${money(total())}。目前待付款，实际支付后会更新状态。`);}save();render();notify('处理结果已同步到员工端。');}
function returnModal(){if(!pendingForRole())return;openModal('退回补正',`<form id="return-form" class="stack"><div class="field"><label for="return-reason">请说明需要员工补充或更正的内容</label><textarea id="return-reason" rows="4" maxlength="300" placeholder="例如：请补充本次住宿与项目交付的关系说明。" required></textarea></div><div class="notice neutral">退回原因将出现在员工对话中。重新提交后从主管审批重新开始，保留原流程版本与历史意见。</div></form>`,`<button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" form="return-form" class="btn danger">确认退回</button>`);}
function paymentModal(){const e=state.expense;if(state.role!=='finance'||e.stage!=='payment'||e.paid)return notify('当前没有可登记的付款任务。');openModal('登记实际付款',`<form id="payment-form" class="stack"><div class="notice warn">仅登记本原型的付款事实，不执行银行转账。此处仅支持全额付款。</div><div class="form-grid"><div class="field"><label>收款人</label><input value="林悦 · 本人报销" disabled></div><div class="field"><label>付款金额（元）</label><input value="${money(total())}" disabled></div><div class="field"><label for="pay-date">付款日期</label><input type="date" id="pay-date" value="2026-11-09" required></div><div class="field"><label for="pay-reference">付款凭据编号</label><input id="pay-reference" maxlength="80" placeholder="填写支付记录或凭据编号" required></div></div><div><button type="button" class="btn small" data-action="sample-payment">填入示例凭据编号</button></div><label class="check"><input type="checkbox" id="pay-check" required>我确认本次付款信息，并理解这是演示登记</label></form>`,`<button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" form="payment-form" class="btn primary">确认登记</button>`);}
function uploadModal(){if(!canEdit()||!state.expense.created)return notify('先创建报销草稿；已提交单据需退回或撤回后补充。');openModal('补充原始资料',`<form id="upload-form" class="stack"><div class="field"><label for="upload-type">资料类型</label><select id="upload-type">${Object.entries(attachmentTypes).map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select></div><div class="field"><label for="upload-file">选择文件</label><input id="upload-file" type="file" accept=".pdf,.ofd,.xml,.jpg,.jpeg,.png" required></div><div class="notice neutral">仅保存文件名称与资料类型，不读取、上传或识别文件内容。同类文件重新选择将替换当前关联并保留操作记录。</div></form>`,`<button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" form="upload-form" class="btn primary">关联到报销单</button>`);}
document.addEventListener('click',e=>{const role=e.target.closest('[data-role]');if(role){switchRole(role.dataset.role);return;}const sw=e.target.closest('[data-switch]');if(sw){switchRole(sw.dataset.switch);return;}const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;state.tab='detail';save();render();return;}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;save();render();$('#detail-tab-'+state.tab)?.focus();return;}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,x=state.expense;
 if(action==='sample')sendText(SAMPLE);
 else if(action==='voice'){openModal('语音输入 · 演示',`<div class="voice-preview"><b>正在录音</b><span class="mono voice-duration">00:00</span><div class="voice-bars">${Array.from({length:25},(_,i)=>`<i style="height:${[12,25,18,40,30,48,22][i%7]}px;--i:${i}"></i>`).join('')}</div><span class="tiny">完成后可核对文字，再发送给小赢</span></div><div class="notice neutral">本原型使用预设语音示例，不调用麦克风。真实语音识别可在后续接入。</div>`,`<button type="button" class="btn" data-action="close-modal">取消</button><button type="button" class="btn primary" data-action="voice-finish">完成转写</button>`);const started=Date.now();const timer=setInterval(()=>{const node=modal.querySelector('.voice-duration');if(!modal.open||!node)return clearInterval(timer);node.textContent='00:'+String(Math.min(59,Math.floor((Date.now()-started)/1000))).padStart(2,'0');},1000);modal.addEventListener('close',()=>clearInterval(timer),{once:true});}
 else if(action==='voice-finish'){modal.close();$('#chat-input').value=SAMPLE;$('#chat-input').focus();notify('转写示例已放入输入框，可修改后发送。');}
 else if(action==='progress'){message('帮我查一下报销进度。','user');message(progressText());save();render();}
 else if(action==='sample-tickets')addSamples(false);
 else if(action==='sample-folio')addSamples(true);
 else if(action==='edit')editModal();
 else if(action==='submit')submitExpense();
 else if(action==='confirm-submit'){if(!canEdit())return;if(!$('#employee-confirm')?.checked)return notify('请先确认已核对报销内容与材料。');if(!x.route)x.route={...state.config};x.stage='manager';x.returnReason='';event('员工确认并提交',`申请 ¥${money(total())}；锁定流程 v${x.route.version}。`,'林悦');message('我已核对并确认提交。','user');message('已提交给主管周宁。你可以随时查询进度，处理结果会在这里同步。');modal.close();save();render();notify('报销已提交，可切换到主管 PC 端继续办理。');}
 else if(action==='receipt')showReceipt(b.dataset.id);
 else if(action==='source'){const a=x.attachments.find(a=>a.type===b.dataset.type);a?showReceipt(a.id):notify('这项原始资料尚未补充。');}
 else if(action==='close-modal')modal.close();
 else if(action==='go-next')switchRole(x.stage==='done'?'finance':nextRole());
 else if(action==='show-detail'){state.view='ledger';state.tab='detail';save();render();}
 else if(action==='approve')approve();
 else if(action==='return')returnModal();
 else if(action==='pay')paymentModal();
 else if(action==='sample-payment')$('#pay-reference').value='DEMO-PAY-20261109-001';
 else if(action==='upload')uploadModal();
 else if(action==='history-modal')openModal('完整处理记录',historyDetail());
 else if(action==='withdraw'){if(state.role!=='employee'||!['manager','boss','finance'].includes(x.stage))return;openModal('撤回修改',`<p>撤回后回到员工草稿，之前的审批意见继续保留。重新提交时按原流程版本，从主管审批重新开始。</p>`,`<button type="button" class="btn" data-action="close-modal">取消</button><button type="button" class="btn primary" data-action="confirm-withdraw">确认撤回</button>`);}
 else if(action==='confirm-withdraw'){if(state.role!=='employee'||!['manager','boss','finance'].includes(x.stage))return;x.stage='draft';x.revision++;event('员工撤回','回到草稿，保留原流程版本和审批历史。','林悦');message('报销已撤回。请修改草稿，确认后重新提交。');modal.close();save();render();}
 else if(action==='post'){if(state.role!=='finance'||x.stage!=='accounting'||x.posted)return;if(!$('#posting-check')?.checked)return notify('请先确认核算依据、科目与金额已复核。');x.posted=true;x.stage='done';event('会计复核并演示过账',`${x.subject}借方 ¥${money(total())}，银行存款贷方 ¥${money(total())}。`);message(`这笔报销已登记付款 ¥${money(total())}，会计已完成演示核算。全部环节已办结，你仍可查看原始资料和处理结果。`);save();render();notify('演示过账完成，员工端与台账已同步。');}
 else if(action==='export')exportLedger();
 else if(action==='reset')openModal('重置这次演示',`<p>将清除本原型在当前浏览器保存的全部业务样例、对话、流程配置和处理记录，回到办理首页。</p><p class="small muted">不会改动产品方案文件或你选择的原始文件。</p>`,`<button type="button" class="btn" data-action="close-modal">取消</button><button type="button" class="btn danger" data-action="confirm-reset">重置演示</button>`);
 else if(action==='confirm-reset'){state=fresh();modal.close();save();render();notify('已回到办理首页，可以重新演示报销或入职。');}
});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const x=state.expense;
 if(form.id==='chat-form'){sendText($('#chat-input').value);}
 else if(form.id==='edit-form'){if(!canEdit())return;if(!form.reportValidity())return;const old=JSON.stringify(x.fields);x.fields.reason=$('#edit-reason').value.trim();x.fields.project=$('#edit-project').value.trim();x.fields.date=$('#edit-date').value;x.fields.lines.forEach((l,i)=>l.cents=Math.round(Number($('#edit-line-'+i).value)*100));if(old!==JSON.stringify(x.fields))event('员工核对并修改草稿','更新事由、项目、日期或金额；原始表达与资料继续保留。','林悦');modal.close();save();render();notify('报销字段已保存，请核对材料后提交。');}
 else if(form.id==='return-form'){if(!pendingForRole())return;const reason=$('#return-reason').value.trim();if(!reason)return notify('请填写具体的退回原因。');x.stage='returned';x.returnReason=reason;x.revision++;event('退回补正',reason);message(`${actors[state.role].name}将报销退回补正：${reason}\n请核对草稿，补充后重新提交。`);modal.close();save();render();notify('退回意见已同步到员工对话。');}
 else if(form.id==='payment-form'){if(state.role!=='finance'||x.stage!=='payment'||x.paid)return;if(!form.reportValidity())return;const reference=$('#pay-reference').value.trim();if(!reference)return notify('请填写有效的付款凭据编号。');x.payment={date:$('#pay-date').value,reference};x.paid=true;x.stage='accounting';event('登记实际付款',`¥${money(total())}；凭据 ${reference}（演示）。`);message(`财务已登记付款 ¥${money(total())}。付款凭据：${reference}。会计正在复核凭证草稿。`);modal.close();save();render();notify('付款已登记，凭证草稿待会计复核。');}
 else if(form.id==='upload-form'){if(!canEdit())return;const file=$('#upload-file').files[0];if(!file)return;if(!/\.(pdf|ofd|xml|jpe?g|png)$/i.test(file.name))return notify('请选择 PDF、OFD、XML 或图片文件。');const type=$('#upload-type').value;const exists=x.attachments.findIndex(a=>a.type===type);const record={id:'file-'+Date.now(),type,name:file.name,sample:false};if(exists>=0)x.attachments.splice(exists,1,record);else x.attachments.push(record);event('关联原始资料',`${attachmentTypes[type]}：${file.name}；仅记录文件名称。`,'林悦');message(`已关联${attachmentTypes[type]}“${file.name}”。原型未读取文件内容，请人工核对。`);modal.close();save();render();}
 else if(form.id==='config-form'){if(state.role!=='boss')return;if(!form.reportValidity())return;const amount=Math.round(Number($('#threshold').value)*100);state.config={threshold:amount,projectRequired:$('#require-project').checked,version:state.config.version+1};save();render();notify('新版本已发布；已提交业务继续使用原版本。');}
});
document.addEventListener('change',e=>{if(e.target.id==='subject'&&state.role==='finance'&&!state.expense.posted){state.expense.subject=e.target.value;save();render();}});
document.addEventListener('keydown',e=>{if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#chat-form').requestSubmit();}const tabs=[...document.querySelectorAll('[data-tab]')],i=tabs.indexOf(e.target);if(i>=0&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;tabs[n].click();}});
function exportLedger(){const e=state.expense;if(!e.created||state.role==='hr')return;const rows=[['业务编号','申请人','项目','申请金额','批准金额','审批状态','付款状态','核算状态'],[e.id,'林悦',e.fields.project,money(total()),e.reviewApproved?money(total()):'',reviewLabel(),e.paid?'已登记':'未付款',e.posted?'已过账':e.paid?'草稿待复核':'未处理']];const safe=v=>{const s=String(v);return '"'+(/^[=+\-@\t\r]/.test(s)?"'":'')+s.replace(/"/g,'""')+'"';};const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='报销台账-演示.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出本笔报销台账。');}
</script>
<script>
/* Full-workspace prototype: shared records extend the original expense workflow. */
(() => {
  'use strict';
  const DATE='2026-11-10', yuan=n=>'¥'+money(Math.round(n*100)), tag=(s,c='')=>`<span class="tag ${c}">${esc(s)}</span>`;
  const btn=(text,act,id='',c='')=>`<button type="button" class="btn ${c}" data-x="${act}" data-id="${esc(id)}">${text}</button>`;
  const link=(text,act,id='')=>`<button type="button" class="x-link" data-x="${act}" data-id="${esc(id)}">${esc(text)} ↗</button>`;
  const panel=(title,body,extra='')=>`<section class="panel"><div class="panel-head"><h3>${title}</h3>${extra}</div><div class="x-panel-body">${body}</div></section>`;

  function showSalary(){const s=P().payroll;const paid=s.rows.filter(r=>r.paid).reduce((n,r)=>n+net(r),0);if(!['hr','boss','finance'].includes(state.role))return notify('薪酬明细不向当前角色开放。');drawer('薪酬批次 · '+s.id,grid([['所属期',s.period],['实发金额',yuan(payTotal())],['已登记发放',yuan(paid)],['当前状态',s.posted?'已入账':payrollLabel()]])+table(['员工','实发','支付状态'],s.rows.map(r=>[r.name,yuan(net(r)),r.paid?'已登记':r.failed?'失败待处理':'未发放']))+`<div class="notice neutral">人力复核数据，老板批准清单，授权资金人员登记发放。失败部分单独重试，已成功项不重复发放。</div>`,s.stage==='boss'&&state.role==='boss'?btn('批准薪酬批次','approve-salary','','primary'):['payment','partial'].includes(s.stage)&&state.role==='finance'?btn('办理本批次发放','salary-pay','','primary'):s.stage==='draft'&&state.role==='hr'?btn('进入薪酬复核','salary-nav','','primary'):tag('当前环节无需你处理'));}

  function ask(q){P().bossChat.push({by:'user',text:q});let answer,basis,source,action;if(/现金|资金|余额/.test(q)){answer='当前样例可用资金为 '+yuan(cash())+'。已扣除实际登记的报销、薪酬和采购支出；未批准的申请不扣款。';basis='口径：账户快照 ¥245,000 ＋ 新增回款 − 已登记支出；数据截止当前演示状态。';source='dashboard';action='核对未来付款安排';}else if(/回款|应收|客户款|收入/.test(q)){answer='累计合同金额 '+yuan(320000)+'，实际已收 '+yuan(P().projects.reduce((n,p)=>n+p.received,0))+'，待收 '+yuan(outstanding())+'。合同口径不等同会计收入。';basis='来源：项目合同与实际收款记录，范围为当前两个样例项目。';source='projects';action='跟进客户回款';}else if(/项目|费用|花了|支出/.test(q)){const p=P().projects[0],used=p.expense+approvedExpense();answer='云帆项目已批准费用 '+yuan(used)+'，预算 '+yuan(p.budget)+'，预算余额 '+yuan(p.budget-used)+'。这不是全部实际付款，也不含未分摊薪酬。';basis='口径：项目费用样例 ¥32,000 ＋ 已批准报销；范围：2026 年 11 月项目经营台账。';source='projects';action='复核云帆项目费用';}else{answer='目前没有足够数据直接回答这个问题。可以先查看现金、回款或项目费用；环比、利润归因需要完整期间与业务依据。';basis='本原型只执行样例范围的确定查询，不编造缺失数据或原因。';source='dashboard';action='补齐经营分析资料';}P().bossChat.push({by:'assistant',text:answer,basis,source,action});commit('回答已附上口径和业务来源。');}

  function exportVisible(){const rows=[...app.querySelectorAll('table tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(td=>td.innerText.replace(/\n/g,' ')));if(!rows.length)return notify('当前页面没有可导出的表格。');const quote=v=>'"'+(/^[=+\-@\t\r]/.test(v)?"'":'')+v.replace(/"/g,'""')+'"';const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='企赢-'+state.view+'-样例.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notify('已导出当前可见清单。');}

    if(kind==='fulfill-request'){if(!writable(['finance']))return;const q=pp.requests.find(q=>q.id===data.id);if(!q||q.stage!=='finance')return;q.stage='done';q.reference=str('reference');if(q.type==='开票')pp.invoices.push({id:id('INV'),number:'DEMO-'+q.id,type:'销项',name:q.title,amount:q.amount,biz:q.project,check:'开票结果已记录'});pp.notifications.push('你的'+q.type+'申请已由财务登记办理结果。');xLog('办理'+q.type,q.id+' / '+q.reference);return done('办理结果已登记并同步员工。');}
    if(kind==='clear-loan'){if(!writable(['finance']))return;const q=pp.requests.find(q=>q.id===data.id);if(!q||q.cleared)return;q.cleared=true;q.clearReference=str('reference');xLog('借款资金退回核销',q.id+' / '+str('reference'));return done('借款已登记全额退回并核销。');}
    if(kind==='action'){if(!writable(['operations','boss']))return;pp.actions.push({id:id('XD'),title:str('title'),owner:str('owner'),source:str('source'),status:'待跟进'});xLog('新增行动',str('title'));return done('跟进行动已建立。');}
    if(kind==='action-done'){const a=pp.actions.find(a=>a.id===data.id);if(!a||a.status==='已完成')return;a.status='已完成';a.result=str('result');xLog('行动办结',a.title+' / '+a.result);return done('行动结果已保留。');}
    if(kind==='template'){if(!writable(['operations']))return;pp.templates[data.key]++;xLog('发布流程模板版本',data.key+' v'+pp.templates[data.key]+' / '+str('note'));return done('新版本已发布，在途实例保留原版本。');}
    if(kind==='expense-template'){if(!writable(['operations','boss']))return;state.config={threshold:Math.round(Number(data.threshold)*100),projectRequired:data.required==='yes',version:state.config.version+1};xLog('发布报销模板', 'v'+state.config.version);return done('配置已发布，不改变已提交单据。');}
    if(kind==='integration'){if(!writable(['operations']))return;pp.integrations[data.key]=true;xLog('保存接入意向',data.key+' / '+str('note'));return done('接入意向已保存，外部通道仍未连接。');}

  document.addEventListener('change',e=>{if(e.target.dataset.closeCheck!==undefined){const n=Number(e.target.dataset.closeCheck);P().closeChecks=P().closeChecks.filter(i=>i!==n);if(e.target.checked)P().closeChecks.push(n);save();}});

  function caseContext(){const j=currentJoin(),e=state.expense;return `<div class="y-case-context"><div><span class="eyebrow">${isJoin()?'PEOPLE / ONBOARDING':'FINANCE / EXPENSE'}</span><h2>${caseLabel()}</h2><p><span class="mono">${caseId()}</span> · ${isJoin()?'人力与综合经办协同':e.created?'审批、付款与核算分别记录':'从员工自然表达开始'}</p></div><div>${caseSwitch()}<div class="y-case-status">${tag(isJoin()?(j.done?'办理清单已归档':'办理中'):e.created?stageLabel():'尚未发起',isJoin()?j.done?'green':'amber':e.stage==='done'?'green':'amber')}</div></div></div>`;}
  function centers(){const notes=isJoin()?['核对材料，逐项办理','入职资料与办理凭据','员工档案与入职进度']:['确认申请，审批与复核','原始表达与票据明细','报销记录与专业结果'];return `<div class="y-centers" aria-label="同一业务的三个中心">${[['flows','clock','流程中心'],['documents','file','单据中心'],['ledgers','ledger','台账中心']].map(([v,ic,t],i)=>`<button type="button" data-y="view" data-id="${v}" class="${state.view===v?'active':''}" ${state.view===v?'aria-current="page"':''}><span class="y-center-num">0${i+1}</span>${icon(ic,19)}<div><b>${t}</b><small>${notes[i]}</small></div>${i<2?'<span class="y-center-arrow">→</span>':''}</button>`).join('')}</div><div class="y-rule-axis"><span>自然表达 · 可补充、可修改</span><span>本人确认 → 职责与证据核对 → 专业规则固化</span><b>口径固定 · 有依据、可追溯</b></div>`;}
  function compactHome(){const e=state.expense,j=currentJoin();return head('把后台的事，办得清楚。','从两条真实的业务线看企赢：先处理事情，再留下资料和专业记录。')+`<div class="y-intro"><div><span class="eyebrow">小赢 · 你的运营助理</span><h2>同一个后台，按职责协同。</h2><p>员工把事情说给小赢；后台人员在这里核对、办理和归档。当前以 <b>${duties[state.role]||'授权经办'}</b> 身份演示，切换岗位后只改变可执行的动作。</p></div><div class="y-intro-steps"><b>流程中心 <span>→</span> 单据中心 <span>→</span> 台账中心</b><small>谁来办 · 依据是什么 · 最终沉淀什么</small></div></div><div class="y-case-cards"><article class="y-case-card"><span class="eyebrow">01 / 报销</span><div class="between"><h2>一句话，到一笔清晰的费用。</h2>${tag(e.created?stageLabel():'从员工端发起',e.stage==='done'?'green':'amber')}</div><p>林悦出差归来，用语音或文字说明费用。小赢整理草稿，员工确认，主管审批，财务复核与付款。</p><div class="y-case-path"><span>申请与审批</span><i>→</i><span>发票 / 行程 / 明细</span><i>→</i><span>报销台账</span></div><div class="y-case-result"><b>专业结果</b><span>费用归集 · 付款登记 · 凭证与核算</span></div><div class="flex wrap">${ybutton(e.created?'继续办理报销':'从员工对话开始','start-expense','','primary')}${ybutton('查看三中心','open-case','expense')}</div><small class="mono">${e.id} · 所有环节引用同一编号</small></article><article class="y-case-card"><span class="eyebrow">02 / 入职</span><div class="between"><h2>一个新人，跨岗位有序接好。</h2>${tag(j?.done?'清单已归档':'待人力与综合经办',j?.done?'green':'blue')}</div><p>张明计划 11 月 16 日入职。人力核对资料、确认合同，综合经办准备设备与账号，最后更新员工档案。</p><div class="y-case-path"><span>入职办理清单</span><i>→</i><span>人事资料 / 办理凭据</span><i>→</i><span>员工与入职台账</span></div><div class="y-case-result"><b>专业结果</b><span>人员档案 · 生效状态 · 可追溯的办理记录</span></div><div class="flex wrap">${ybutton('进入入职办理','open-case','onboarding','primary')}${ybutton('查看原始资料','open-docs','onboarding')}</div><small class="mono">${j?.id||'待建立'} · 人力业务按自身规则交付</small></article></div><div class="y-home-footer"><p><b>还有更多专业能力</b><br><span class="muted">假勤、薪酬、资金、发票、凭证、采购和资产，按岗位从二级入口进入。</span></p>${ybutton('更多专业功能','more')}</div>`;}
  function expenseFlow(){const e=state.expense;if(!e.created)return panel('先由员工确认申请',`<p class="muted">小赢把原始表达整理成可修改的草稿。员工确认事由、项目、费用和附件后，才进入正式审批。</p><div class="y-quote">“帮我报一下广州项目交付的费用，高铁 286，酒店 800，打车 200。”</div>${ybutton('进入员工移动对话','area','employee','primary')}`);return `<div class="y-next"><div><b>当前：${stageLabel()}</b><small>下一职责：${e.stage==='done'?'已完成':actors[nextRole()].role} · 规则 v${(e.route||state.config).version}</small></div>${!['done','draft','returned'].includes(e.stage)&&state.role!==nextRole()?ybutton('切换到'+(duties[nextRole()]||'老板审批'),'duty',nextRole()):''}</div>`+(['hr','operations'].includes(state.role)?panel('办理进度与责任',grid([['申请人','林悦'],['业务编号',e.id],['事由',esc(e.fields.reason)],['当前进度',stageLabel()]])+`<div class="stepper">${flowSteps()}</div><div class="notice neutral">${state.role==='hr'?'当前人力岗位不参与本笔费用复核；可切换到授权财务岗位继续演示。':'综合经办跟进资料与流转，审批和支付由对应岗位执行。'}</div>`)+panel('处理记录',historyDetail()):detailPanel());}

  function expenseLedger(){const e=state.expense;if(!e.created)return panel('草稿确认后开始沉淀',`<p class="muted">台账不凭空生成。先发起业务，之后持续记录申请、批准、付款和核算各自的状态。</p>${ybutton('进入员工对话','area','employee','primary')}`);if(state.role==='hr')return panel('专业记录按职责开放','<p>本笔报销台账不向人力岗位开放。入职台账可从上方切换示例查看。</p>');return panel('报销台账 · 同一业务持续更新',table(['业务 / 申请人','申请 / 批准','审批状态','付款状态','核算状态'],[[e.id+'<small>林悦 · '+esc(e.fields.project)+'</small>','¥'+money(total())+'<small>'+(e.reviewApproved?'批准 ¥'+money(total()):'批准金额待确定')+'</small>',reviewLabel(),e.paid?'已登记付款':'未付款',e.posted?'已过账':e.paid?'凭证草稿待复核':'未处理']]),`<button type="button" class="btn small" data-action="export">导出本笔台账</button>`)+panel('专业结果 · 逐项确认',`<div class="y-outcomes"><div><b>01 业务事实</b><p>员工确认的费用明细与原始资料</p>${tag('源于 '+e.id)}</div><div><b>02 支付事实</b><p>${e.paid?'凭据：'+esc(e.payment.reference):'财务复核通过后，按实际支付结果登记'}</p>${tag(e.paid?'已登记':'尚未付款',e.paid?'green':'amber')}</div><div><b>03 核算结果</b><p>${e.posted?'核算结果已确认，保留来源和办理记录':'付款后生成凭证草稿，由财务核对再过账'}</p>${tag(e.posted?'已过账':'待专业处理',e.posted?'green':'amber')}</div></div><div class="flex wrap">${ybutton('返回流程办理','view','flows')}${state.role==='finance'?ybutton('资金与付款','advanced','payment')+ybutton('凭证中心','advanced','voucher'):ybutton('切换财务经办','duty','finance')}</div><p class="small muted">审批同意、付款完成、凭证过账各自留痕，不能互相替代。</p>`);}
  function joinFlow(){const j=currentJoin();if(!j)return panel('暂无入职实例',btn('发起入职','new-join','','primary'));const who=person(j.employee);return panel('入职办理 · 按责任逐项确认',`<div class="y-next"><div><b>${esc(who.name)} · ${esc(who.dept)}</b><small>计划入职 ${j.date} · 清单 v${j.routeVersion||P().templates.onboard}</small></div>${tag(j.done?'清单已归档':'已完成 '+Object.values(j.tasks).filter(Boolean).length+' / 4 项',j.done?'green':'blue')}</div><div class="check-list">${[['identity','人事资料核对','hr','核对入职材料的完整性与一致性'],['contract','劳动合同签署确认','hr','由授权人员核实签署结果'],['equipment','设备准备与领用','operations','综合经办落实设备交接'],['account','工作账号开通','operations','合同确认后再登记账号办理结果']].map(([k,t,role,n])=>`<div class="check-item y-join-item"><span class="y-task-check ${j.tasks[k]?'done':''}">${j.tasks[k]?'✓':'○'}</span><div><b>${t}</b><small>${duties[role]} · ${n}</small></div>${j.tasks[k]?tag('已确认','green'):state.role===role?btn('确认完成','join-task',j.id+'|'+k,'small'):ybutton('切换'+duties[role],'duty',role,'small')}</div>`).join('')}</div><div class="y-join-close"><p class="small muted">清单完成后由人力归档。生效日期晚于样例业务日时，员工状态为“待生效”。</p>${j.done?tag('已归档','green'):state.role==='hr'?btn('归档并更新档案','join-complete',j.id,'primary'):ybutton('切换人力归档','duty','hr')}</div><p class="tiny muted">确认按钮演示办理留痕；合同签署与账号创建仍需真实办理凭据。</p>`);}
  function joinDocs(){const j=currentJoin();if(!j)return '';const restricted=!['hr','boss'].includes(state.role);return panel('资料与办理凭据 · 共用 '+j.id,table(['资料 / 凭据','来源与状态','使用方式',''],[['入职材料.zip',restricted?'人事敏感资料 · 当前岗位受限':'员工提交 · 待人力核对','关联员工与入职编号',restricted?tag('按权可见'):link('查看资料索引','doc','D-005')],['人事资料核对记录',j.tasks.identity?'人力确认已留痕':'尚未确认','确认后用于档案归集',tag(j.tasks.identity?'已确认':'待确认',j.tasks.identity?'green':'amber')],['劳动合同签署确认',j.tasks.contract?'签署核实动作已记录':'待人力核实签署结果','决定账号办理前置条件',tag(j.tasks.contract?'已确认':'待确认',j.tasks.contract?'green':'amber')],['设备与账号办理记录',(j.tasks.equipment?'设备已确认':'设备待确认')+' / '+(j.tasks.account?'账号已确认':'账号待确认'),'综合经办提交办理结果',ybutton('查看办理清单','view','flows','small')]]))+`<div class="notice neutral">原始资料就源提交，办理中再形成确认凭据；这里区分“资料存在”和“核对完成”。敏感原件按岗位授权开放，原型不存储真实材料内容。</div>`;}
  function joinLedger(){const j=currentJoin();if(!j)return '';const who=person(j.employee),count=Object.values(j.tasks).filter(Boolean).length;return panel('员工档案 · 人力专业记录',grid([['员工编号',who.id],['姓名 / 团队',esc(who.name)+' / '+esc(who.dept)],['计划入职日期',j.date],['员工状态',tag(who.status,who.status==='在职'?'green':'amber')],['来源流程',j.id],['更新依据',j.done?'人力已归档；按生效日期更新状态':'入职流程已建立；办理结果尚未全部归档']]))+panel('入职台账 · 跨岗位办理记录',table(['流程编号','材料核对','合同确认','设备办理','账号办理','归档'],[[j.id,...['identity','contract','equipment','account'].map(k=>tag(j.tasks[k]?'已确认':'待办理',j.tasks[k]?'green':'amber')),j.done?'已归档':'完成 '+count+' / 4 项']]))+`<div class="y-branch-result"><div>${icon('people',25)}<b>入职的专业结果是人员档案与办理记录</b><p>当前示例不生成财务凭证。后续如发生设备采购或薪酬业务，再分别进入对应流程与专业规则。</p></div>${ybutton('回到流程继续办理','view','flows')}</div>`;}

  function advancedBody(){const view=state.view;if(view.startsWith('all-')){state.view=view.slice(4);const result=originalBody();state.view=view;return result;}return originalBody();}
  function advancedMenu(){const entries=nav[state.role]||nav.operations;drawer('更多专业功能',`<p class="muted">当前岗位：${duties[state.role]||'老板'}。核心示例始终从办理首页进入；以下保留其他专业能力。</p><div class="y-more-grid">${entries.filter(([v])=>!['home','flows','documents','ledgers'].includes(v)).map(([v,ic,t])=>ybutton(icon(ic,18)+t,'advanced',v)).join('')}${state.role!=='boss'?Object.keys(coreViews).filter(v=>v!=='home').map(v=>ybutton('全部'+coreViews[v],'advanced','all-'+v)).join(''):''}</div><div class="notice neutral">岗位可在页头切换；薪酬、付款、核算与流程发布各有独立办理权限。</div>`);}
  desktopShell=function(){compact();const allowed=(nav[state.role]||[]).map(v=>v[0]).concat(Object.keys(coreViews),['all-flows','all-documents','all-ledgers']);if(['manager','boss','finance'].includes(state.role))allowed.push('ledger');if(!allowed.includes(state.view))state.view='home';const boss=state.role==='boss',items=boss?[['home','chat','经营对话'],['dashboard','chart','经营概览'],['approvals','check','关键审批']]:[['home','home','办理首页'],['flows','clock','流程中心'],['documents','file','单据中心'],['ledgers','ledger','台账中心']];const title=items.find(i=>i[0]===state.view)?.[2]||(state.view.startsWith('all-')?'全部'+coreViews[state.view.slice(4)]:(nav[state.role]||[]).find(i=>i[0]===state.view)?.[2])||'专业办理';const a=actors[state.role];return `<div class="desktop-app x-app y-app"><aside class="app-sidebar"><div class="company"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><b>企赢</b><small>云帆创新 · 演示企业</small></div></div><div class="sidebar-title">${boss?'老板经营':'后台办理'}</div><nav class="app-nav" aria-label="${boss?'老板经营':'后台办理'}主要功能">${items.map(([v,ic,t])=>`<button type="button" data-y="view" data-id="${v}" class="${state.view===v?'active':''}" ${state.view===v?'aria-current="page"':''}>${icon(ic,18)}${t}</button>`).join('')}</nav><button type="button" class="y-more-button" data-y="more">${icon('settings',17)}更多专业功能</button><div class="y-sidebar-note">${boss?'围绕关键事项，查看经营依据。':'同一笔业务，贯通三个中心。'}<small>小赢整理与跟进<br>专业人员核对与确认</small></div><div class="sidebar-account"><span class="avatar">${a.name[0]}</span><div><b>${a.name}</b><small>${boss?'公司负责人':duties[state.role]}</small></div></div></aside><div class="app-main"><div class="app-topbar"><span class="breadcrumb">${boss?'老板经营':'后台办理'} / <b>${title}</b></span><div class="flex wrap">${boss?'':`<label class="y-duty-label">演示岗位 <select id="y-duty" aria-label="切换后台办理岗位">${Object.entries(duties).map(([v,t])=>`<option value="${v}" ${v===state.role?'selected':''}>${t}</option>`).join('')}</select></label>`}${btn('待办','inbox','','small')}</div></div><div class="app-content">${boss?advancedBody():state.view==='home'?compactHome():['flows','documents','ledgers'].includes(state.view)?caseBody():`<div class="y-back-line">${ybutton('← 回到核心示例','view','home','small')}<span class="muted small">专业功能 / ${title}</span></div>`+advancedBody()}<div class="operator-notice">企赢系统原型 · 三个入口，共享业务底座 · 业务进度保存在本机 · 语音、AI 与外部服务为演示 · 岗位切换不代表生产权限验证</div></div></div></div>`;};
  employeeMobile=function(){let html=oldMobile();html=html.replace('<div class="phone-compose">','<div class="phone-compose"><div class="quick-replies y-office-shortcuts"><button type="button" data-x="office">其他办公事项</button><button type="button" data-x="my-requests">我的办理进度</button></div>');const extras=P().notifications.slice(-2).map(n=>`<div class="msg"><div class="msg-label">小赢</div><div class="bubble">${esc(n)}</div></div>`).join('');html=html.replace('</div><div class="phone-compose">',extras+'</div><div class="phone-compose">');html=html.replace('员工端','日常办公');html=html.replace('演示建议：用示例发起 → 加入票据 → 补住宿明细 → 确认提交，再切换到 PC 端审批。','报销示例：说出费用、补齐材料、确认提交。再进入后台办理，在同一编号下查看流程、单据和台账。');return html;};
  showJoin=function(jid){if(!['employee','boss'].includes(state.role)&&isJoin()&&currentJoin()?.id===jid&&['flows','documents','ledgers'].includes(state.view)){if(modal.open)modal.close();return;}return originalShowJoin(jid);};
  map=function(){advancedMenu();};
  Object.entries(duties).forEach(([r,t])=>{actors[r].work='后台办理 · '+t;});
  actors.boss.work='老板经营';
  const originalSwitchRole=switchRole;
  switchRole=function(r){originalSwitchRole(r);if(duties[r]&&state.expense.created&&r===nextRole()){compact().case='expense';state.view='flows';save();render();}};
  const expandedRender=render;
  render=function(){compact();if(duties[state.role])compact().duty=state.role;expandedRender();document.querySelectorAll('[data-y="area"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===(state.role==='employee'?'employee':state.role==='boss'?'boss':'back'))));};
  document.querySelector('.surface-switch').innerHTML=[['employee','日常办公 · 手机'],['back','后台办理 · PC'],['boss','老板经营 · PC']].map(([v,t])=>`<button type="button" data-y="area" data-id="${v}" aria-pressed="false">${t}</button>`).join('');
  document.querySelector('.surface-switch').setAttribute('aria-label','切换三个用户入口');
  document.querySelector('.prototype-name .muted').textContent='系统原型 · 后台运营中心';
  document.title='企赢 · 系统原型';
  document.addEventListener('click',e=>{const b=e.target.closest('[data-y]');if(!b)return;const action=b.dataset.y,key=b.dataset.id;
    if(action==='more')return advancedMenu();
    if(action==='area'){if(modal.open)modal.close();state.role=key==='back'?compact().duty:key;state.view='home';}
    else if(action==='duty'){if(modal.open)modal.close();state.role=key;if(key==='boss')state.view='approvals';else compact().duty=key;}
    else if(action==='view')state.view=key;
    else if(action==='case'){compact().case=key;}
    else if(action==='open-case'||action==='open-docs'){compact().case=key;state.view=action==='open-docs'?'documents':'flows';if(key==='onboarding'&&!['operations','hr'].includes(state.role)){state.role='hr';compact().duty='hr';}}
    else if(action==='start-expense'){compact().case='expense';state.view=state.expense.created?'flows':'home';if(!state.expense.created)state.role='employee';}
    else if(action==='advanced'){if(modal.open)modal.close();state.view=key;}
    save();render();window.scrollTo({top:0,behavior:'instant'});
  });
  document.addEventListener('change',e=>{if(e.target.id==='y-duty'){compact().duty=e.target.value;state.role=e.target.value;save();render();}});
  if(location.hash==='#expense'||location.hash==='#onboarding'){compact().case=location.hash.slice(1);state.role='operations';state.view='flows';}

  render();
})();

</script>
</body>
</html>
