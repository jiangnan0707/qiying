.phase-grid,.rule-config{grid-template-columns:1fr 1fr} .table-scroll{overflow:visible} table{min-width:0!important;font-size:9pt} th,td{padding:9px} .phase{grid-template-columns:70px 1fr} .step-list{grid-template-columns:repeat(4,1fr)} .paper,.phase-content,.state-box,.workspace,.case-intro,.gate,.decision{break-inside:avoid} a{color:inherit;text-decoration:none} .print-appendix{display:block;margin-top:25px} .print-appendix article{break-inside:avoid;margin-top:15px} .print-appendix p{font-size:10pt;color:var(--muted)} .arch-roles,.case-intro{-webkit-print-color-adjust:exact;print-color-adjust:exact} .field{display:none} .footer{margin-top:25px} }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip-link\" href=\"#content\">跳到正文\u003c/a>\n\u003cdiv class=\"shell\">\n  \u003caside class=\"sidebar\" aria-label=\"路线图导航\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cdiv>\u003cstrong>企赢\u003c/strong>\u003cdiv class=\"caption\">AI 后台运营中心\u003c/div>\u003c/div>\u003c/div>\n    \u003cnav class=\"nav\">\n      \u003ca href=\"#position\" class=\"active\">\u003cspan>01\u003c/span>定位与验证目标\u003c/a>\n      \u003ca href=\"#architecture\">\u003cspan>02\u003c/span>业务架构\u003c/a>\n      \u003ca href=\"#roles\">\u003cspan>03\u003c/span>多角色工作台\u003c/a>\n      \u003ca href=\"#journey\">\u003cspan>04\u003c/span>从表达走到结果\u003c/a>\n      \u003ca href=\"#rules\">\u003cspan>05\u003c/span>流程与专业规则\u003c/a>\n      \u003ca href=\"#roadmap\">\u003cspan>06\u003c/span>分阶段路线图\u003c/a>\n      \u003ca href=\"#expansion\">\u003cspan>07\u003c/span>工作台扩展与边界\u003c/a>\n      \u003ca href=\"#decisions\">\u003cspan>08\u003c/span>首版边界与决策\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"sidebar-foot\">\u003cdiv>以报销验证资金与核算\u003cbr>以入职验证人力与协同\u003c/div>\u003cdiv class=\"utility\">\u003cbutton class=\"small-btn theme-button\" type=\"button\">切换深色\u003c/button>\u003cbutton class=\"small-btn print-button\" type=\"button\">打印 / PDF\u003c/button>\u003c/div>\u003cspan>方案 v1.3 · 2026.11.12\u003cbr>建议方案，尚未进入开发排期\u003c/span>\u003c/div>\n  \u003c/aside>\n  \u003cmain id=\"content\">\n    \u003cdiv class=\"doc-meta\">\u003cspan class=\"status\">产品讨论稿 · 三个入口 · 报销与入职双示例\u003c/span>\u003cdiv class=\"utility\">\u003cbutton class=\"small-btn theme-button\" type=\"button\">切换深色\u003c/button>\u003cbutton class=\"small-btn print-button\" type=\"button\">打印 / PDF\u003c/button>\u003c/div>\u003c/div>\n    \u003cheader class=\"hero\">\n      \u003cdiv class=\"eyebrow\">报销与入职，共用一套后台运营底座\u003c/div>\n      \u003ch1>自然表达进入，\u003cbr>专业规则交付。\u003c/h1>\n      \u003cp class=\"lead\">企赢为初创团队提供共享的后台运营底座。员工把事情告诉小赢，由小赢整理资料并推动流程；老板确认关键事项，财务、人力与综合经办在同一个后台按职责完成专业处理。\u003c/p>\n      \u003cdiv class=\"hero-thesis\">三个用户入口 \u003cspan>／\u003c/span> 同一份业务记录 \u003cspan>／\u003c/span> 逐步收敛的规则\u003c/div>\n    \u003c/header>\n    \u003cdiv class=\"scope-strip\">\u003cdiv>\u003cb>首个业务\u003c/b>员工报销 → 付款 → 核算\u003c/div>\u003cdiv>\u003cb>对照业务\u003c/b>入职 → 办理清单 → 员工档案\u003c/div>\u003cdiv>\u003cb>首版原则\u003c/b>先完成一条闭环，再扩展场景\u003c/div>\u003cdiv>\u003cb>阅读方式\u003c/b>角色、案例与流程规则可交互\u003c/div>\u003c/div>\n\n    \u003csection id=\"position\">\n      \u003cdiv class=\"section-head\">\u003cdiv class=\"eyebrow\">01 / 定位与验证目标\u003c/div>\u003ch2>把零散事务接住，把专业结果做实。\u003c/h2>\u003cp>本方案优先服务缺少完整后台团队、由老板兼任多个职责的深圳初创企业。专业人员可以是内部财务、HR，也可以是获得授权的外部协作人员。\u003c/p>\u003c/div>\n      \u003cdiv class=\"two-col\">\n        \u003cdiv class=\"paper\">\u003ch3>产品承诺\u003c/h3>\u003cul class=\"brief-list\">\u003cli>\u003cb>员工少填表\u003c/b>\u003cspan>通过对话、语音转文字或上传资料发起事务，确认系统整理的业务单据。\u003c/span>\u003c/li>\u003cli>\u003cb>老板少追问\u003c/b>\u003cspan>关键审批同时附上业务背景、原始依据、检查结果和待确认项。\u003c/span>\u003c/li>\u003cli>\u003cb>专业人员少搬数据\u003c/b>\u003cspan>复用同一份资料与业务记录，聚焦例外、专业复核和结果交付。\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\n        \u003cdiv class=\"paper\">\u003ch3>首轮要证明什么\u003c/h3>\u003cul class=\"brief-list\">\u003cli>\u003cb>角色协同成立\u003c/b>\u003cspan>一笔业务跨角色推进，状态一致，权限不同；同一人可兼任多个角色。\u003c/span>\u003c/li>\u003cli>\u003cb>开放输入能可靠收敛\u003c/b>\u003cspan>原话与附件能转为可确认的字段，缺项会追问，不确定项进入人工处理。\u003c/span>\u003c/li>\u003cli>\u003cb>后续结果有据可查\u003c/b>\u003cspan>台账、付款记录和凭证草稿都能回溯到业务单据及原始依据。\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"callout\">\u003cb>试点假设：\u003c/b>先找 3–5 家资料形态相近的小团队验证报销；不把人数、行业或付费意愿当成已验证结论。首轮考察真实材料、办理成本与持续使用意愿。\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"architecture\">\n      \u003cdiv class=\"section-head\">\u003cdiv class=\"eyebrow\">02 / 业务架构\u003c/div>\u003ch2>工作台是视图，业务记录是共同基础。\u003c/h2>\u003cp>表达越往前越自由，影响资金和专业结果的动作越往后越受约束。权限、金额校验和审计从入口就生效。\u003c/p>\u003c/div>\n      \u003cdiv class=\"architecture\">\n        \u003cdiv class=\"arch-roles\">\u003cdiv>\u003cb>日常办公\u003c/b>\u003csmall>手机对话 · 发起 · 补件 · 查进度\u003c/small>\u003c/div>\u003cdiv>\u003cb>后台办理\u003c/b>\u003csmall>PC 协同 · 综合经办 / 人力 / 财务 / 审批\u003c/small>\u003c/div>\u003cdiv>\u003cb>老板经营\u003c/b>\u003csmall>PC 对话 · 关键审批 · 经营分析\u003c/small>\u003c/div>\u003c/div>\n        \u003cdiv class=\"arch-bridge\">流程中心：谁来办 → 单据中心：依据是什么 → 台账中心：留下什么记录。资料可在办理中补充，三个中心按同一业务编号关联。\u003c/div>\n        \u003cdiv class=\"arch-core\">\n          \u003cdiv class=\"arch-stack\">\n            \u003cdiv class=\"arch-row\">\u003cspan class=\"index\">1\u003c/span>\u003cdiv>\u003cb>表达与原始资料\u003c/b>\u003csmall>允许非结构化输入\u003c/small>\u003c/div>\u003cp>自然语言、语音转文字、发票、行程单、合同或表格。保留原文件、原话、上传人及时间。\u003c/p>\u003c/div>\n            \u003cdiv class=\"arch-row\">\u003cspan class=\"index\">2\u003c/span>\u003cdiv>\u003cb>结构化业务单据\u003c/b>\u003csmall>由候选信息到用户确认\u003c/small>\u003c/div>\u003cp>AI 提取事由、金额、日期、项目和附件关系；每个字段保留来源。缺失追问，歧义确认，再提交。\u003c/p>\u003c/div>\n            \u003cdiv class=\"arch-row\">\u003cspan class=\"index\">3\u003c/span>\u003cdiv>\u003cb>流程与规则检查\u003c/b>\u003csmall>人与规则共同推进\u003c/small>\u003c/div>\u003cp>按模板执行审核、审批、补正、撤回和提醒。流程与资料相互触发；流程实例保留使用的规则版本。\u003c/p>\u003c/div>\n            \u003cdiv class=\"arch-row\">\u003cspan class=\"index\">4\u003c/span>\u003cdiv>\u003cb>专业业务台账\u003c/b>\u003csmall>全过程记录，状态分开\u003c/small>\u003c/div>\u003cp>报销、员工借款、请假等台账从草稿开始记录。区分申请、批准与实际金额；审批、付款、入账状态独立。\u003c/p>\u003c/div>\n            \u003cdiv class=\"arch-row\">\u003cspan class=\"index\">5\u003c/span>\u003cdiv>\u003cb>专业引擎与结果\u003c/b>\u003csmall>固定规则、复核与留痕\u003c/small>\u003c/div>\u003cp>财务：收付款、核算、结账；人力：假勤、薪酬数据准备。按业务事实与专业政策处理，AI 不直接决定过账。\u003c/p>\u003c/div>\n          \u003c/div>\n          \u003caside class=\"arch-aside\">\u003cdiv class=\"rigidity\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cdiv>\u003cstrong>规则逐步收敛 ↓\u003c/strong>\u003cp>表达可以多样\u003cbr>字段需要确认\u003cbr>流程需要授权\u003cbr>核算必须有依据\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>贯穿全程\u003c/strong>\u003cp>组织与角色权限\u003cbr>原始依据与版本\u003cbr>操作记录与责任人\u003cbr>异常及人工处理\u003c/p>\u003c/div>\u003c/aside>\n        \u003c/div>\n        \u003cdiv class=\"outputs\">\u003cdiv>\u003cb>经营结果 ← 业务台账直接提供\u003c/b>\u003cp>待付款、项目费用、待办与异常，按统计口径及时展示。\u003c/p>\u003c/div>\u003cdiv>\u003cb>财务结果 ← 核算、过账与结账后提供\u003c/b>\u003cp>凭证与财务报表遵循会计口径，与管理口径分开显示。\u003c/p>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"callout\">\u003cb>两条重要关系：\u003c/b>资料可以先于流程，也可以在办理中补入；业务单据与台账可用同一份业务记录组织，台账是查询视图，不必复制成另一套数据。\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"roles\">\n      \u003cdiv class=\"section-head\">\u003cdiv class=\"eyebrow\">03 / 三个用户入口\u003c/div>\u003ch2>入口收敛，岗位责任保留。\u003c/h2>\u003cp>员工办事、后台经办、老板决策分别进入一个界面。人力、财务和综合经办在同一个后台按授权切换职责；审批、付款、核算与资料访问分别控制。\u003c/p>\u003c/div>\n      \u003cdiv class=\"role-tabs\" role=\"tablist\" aria-label=\"切换三个用户入口\">\u003cbutton type=\"button\" role=\"tab\" id=\"tab-employee\" aria-controls=\"role-panel\" aria-selected=\"true\" data-role=\"employee\">日常办公 · 手机\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-operations\" aria-controls=\"role-panel\" aria-selected=\"false\" tabindex=\"-1\" data-role=\"operations\">后台办理 · PC\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-boss\" aria-controls=\"role-panel\" aria-selected=\"false\" tabindex=\"-1\" data-role=\"boss\">老板经营 · PC\u003c/button>\u003c/div>\n      \u003cdiv class=\"workspace\" id=\"role-panel\" role=\"tabpanel\" aria-labelledby=\"tab-employee\" tabindex=\"0\">\u003c/div>\n      \u003cdiv class=\"table-scroll role-matrix\">\u003ctable>\u003cthead>\u003ctr>\u003cth>角色\u003c/th>\u003cth>首屏重点\u003c/th>\u003cth>核心职责\u003c/th>\u003cth>可见范围\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>运营\u003c/b>\u003c/td>\u003ctd>跨岗待办、补件与异常\u003c/td>\u003ctd>资料协调、流程跟进、授权台账维护\u003c/td>\u003ctd>授权企业与业务；薪酬和付款权限单独授予\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>员工\u003c/b>\u003c/td>\u003ctd>我要办事、我的待办、进度\u003c/td>\u003ctd>确认单据、补充依据\u003c/td>\u003ctd>本人申请与获授权事项\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>人力\u003c/b>\u003c/td>\u003ctd>人员变动、假勤待处理\u003c/td>\u003ctd>人员资料和假勤复核\u003c/td>\u003ctd>授权人员范围；薪酬单独授权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>财务\u003c/b>\u003c/td>\u003ctd>待审核、待付款、待入账\u003c/td>\u003ctd>费用复核、付款记录与核算\u003c/td>\u003ctd>授权主体及业务；不默认看完整人事档案\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>老板\u003c/b>\u003c/td>\u003ctd>关键决策、经营异常\u003c/td>\u003ctd>审批、分派、查看汇总\u003c/td>\u003ctd>本人管理权限内；敏感薪酬仍需授权\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n      \u003cdiv class=\"callout\">\u003cb>运营工作台与共享中心：\u003c/b>流程中心、单据中心、台账中心是全平台共享能力。运营经办集中跟进，财务和 HR 可按权限直接处理自己负责的记录。同一员工也可以是审批人，所有工作台复用统一待办。\u003c/div>\u003cdiv class=\"callout\">\u003cb>兼岗与外部协作：\u003c/b>同一账号可以叠加老板、财务、HR 等职责，待办合并展示；外部会计仅访问被授权的企业、期间及资料，不能跨企业查询。\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"journey\">\n      \u003cdiv class=\"section-head\">\u003cdiv class=\"eyebrow\">04 / 从表达走到结果\u003c/div>\u003ch2>一笔报销，走过完整的处理链路。\u003c/h2>\u003cp>切换案例，再点击处理阶段，查看每一步的输入、责任人与交付。此处是方案讲解器，不连接语音识别、税务、银行或会计系统。\u003c/p>\u003c/div>\n      \u003cdiv class=\"scenario-toolbar\">\u003cdiv class=\"segmented\" aria-label=\"切换业务案例\">\u003cbutton type=\"button\" data-scenario=\"expense\" aria-pressed=\"true\">报销 · 主线\u003c/button>\u003cbutton type=\"button\" data-scenario=\"leave\" aria-pressed=\"false\">请假 · 对照\u003c/button>\u003c/div>\u003cspan class=\"subtle\" id=\"case-kind\">验证财务闭环：资料、审批、台账、付款、凭证\u003c/span>\u003c/div>\n      \u003cdiv class=\"case-intro\">\u003cdiv class=\"voice\">\u003cspan class=\"caption\">员工自然表达 · 示例\u003c/span>\u003cblockquote id=\"case-quote\">\u003c/blockquote>\u003c/div>\u003cdiv class=\"case-facts\" id=\"case-facts\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"case-body\">\u003cdiv class=\"step-list\" id=\"step-list\" aria-label=\"选择处理阶段\">\u003c/div>\u003cdiv class=\"trace\" id=\"trace-panel\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"trace-footer\">\u003cspan class=\"subtle\" id=\"trace-caption\">\u003c/span>\u003cdiv class=\"trace-controls\">\u003cbutton type=\"button\" class=\"small-btn\" id=\"prev-step\">上一步\u003c/button>\u003cbutton type=\"button\" class=\"small-btn\" id=\"next-step\">下一步\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"print-appendix\" id=\"print-cases\">\u003c/div>\n      \u003cdiv class=\"callout warn\">\u003cb>报销不只有发票：\u003c/b>事由、业务归属和必要证明共同构成依据。发票结构校验、重复检测与税务平台查验分别记录；“已识别”不能显示为“已验真”。首期未接通的外部查验保留为待人工核验。\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"rules\">\n      \u003cdiv class=\"section-head\">\u003cdiv class=\"eyebrow\">05 / 流程与专业规则\u003c/div>\u003ch2>让流程可配置，让专业边界保持稳定。\u003c/h2>\u003cp>配置中心供授权管理员使用；员工只看到“我要报销”“我要请假”和自己的任务。首期采用模板加少量参数，不开放任意编排。\u003c/p>\u003c/div>\n      \u003cdiv class=\"paper rule-config\">\n        \u003cdiv>\u003ch3>报销流程 · 配置演示\u003c/h3>\u003cp class=\"subtle\">测试单：¥1,286。修改阈值，查看同一业务如何进入不同审批路径。\u003c/p>\u003cdiv class=\"field\">\u003clabel for=\"approval-threshold\">超过此金额，增加老板审批\u003c/label>\u003cdiv class=\"input-unit\">\u003cspan>¥\u003c/span>\u003cinput id=\"approval-threshold\" type=\"number\" min=\"0\" max=\"10000000\" step=\"any\" value=\"2000\" inputmode=\"decimal\" aria-describedby=\"threshold-hint\">\u003c/div>\u003csmall class=\"subtle\" id=\"threshold-hint\">严格大于阈值时触发；主管审批、财务复核始终保留。\u003c/small>\u003c/div>\u003clabel class=\"check-row\">\u003cinput type=\"checkbox\" id=\"project-required\" checked>本模板要求选择项目\u003c/label>\u003cdiv class=\"rule-note\">仅演示金额分支与项目必填。实际发布须有管理员权限、版本号与生效时间；在途单据继续使用其既有版本。\u003c/div>\u003c/div>\n        \u003cdiv class=\"route-preview\">\u003ch4>测试单的预期路径\u003c/h4>\u003cdiv id=\"route-line\" class=\"route-line\" aria-live=\"polite\">\u003c/div>\u003cp class=\"subtle\" id=\"route-reason\" aria-live=\"polite\">\u003c/p>\u003cdiv class=\"rule-note\" id=\"project-rule\">\u003c/div>\u003cdiv class=\"rule-note\">\u003cb>配置不能绕过：\u003c/b>权限、有效金额、重复付款拦截与操作留痕。审批通过后形成待付款任务，实际付款仍由授权人员确认。\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"states\">\u003cdiv class=\"state-box\">\u003ch4>审批状态\u003c/h4>\u003cspan class=\"tag blue\">已批准\u003c/span>\u003cp>表明有权人同意该申请。退回、撤回和重新提交保留历史及版本。\u003c/p>\u003c/div>\u003cdiv class=\"state-box\">\u003ch4>付款状态\u003c/h4>\u003cspan class=\"tag warn\">待付款\u003c/span>\u003cp>凭实际支付结果更新。保留付款记录，避免重复确认；驳回不能抹去已发生的付款。\u003c/p>\u003c/div>\u003cdiv class=\"state-box\">\u003ch4>核算状态\u003c/h4>\u003cspan class=\"tag\">待会计复核\u003c/span>\u003cp>按业务事实判断核算时点。批准后可形成应付，付款后处理结算，不重复确认费用。\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"table-scroll contract-table\" style=\"margin-top:20px\">\u003ctable>\u003cthead>\u003ctr>\u003cth>能力层\u003c/th>\u003cth>允许 AI 做什么\u003c/th>\u003cth>规则或人负责什么\u003c/th>\u003cth>异常怎么走\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>表达与材料\u003c/td>\u003ctd>提取字段、建议分类、追问缺项\u003c/td>\u003ctd>员工确认事由、金额与归属；原件保留\u003c/td>\u003ctd>无法识别或有歧义 → 待补充 / 人工确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>审核与流程\u003c/td>\u003ctd>说明疑点、整理依据、草拟补正要求\u003c/td>\u003ctd>规则算金额、查重、匹配审批人；授权人作决定\u003c/td>\u003ctd>模型不可用 → 保留草稿，转人工；不自动放行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>专业台账\u003c/td>\u003ctd>建议项目和费用分类\u003c/td>\u003ctd>记录唯一业务编号、实际状态与调整历史\u003c/td>\u003ctd>单据变化 → 重新检查受影响环节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>核算与报表\u003c/td>\u003ctd>解释匹配建议与报表变动\u003c/td>\u003ctd>专业规则生成草稿，会计复核过账，按账期出表\u003c/td>\u003ctd>依据不足 → 暂缓；已过账更正走冲销 / 调整\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"roadmap\">\n      \u003cdiv class=\"section-head\">\u003cdiv class=\"eyebrow\">06 / 分阶段路线图\u003c/div>\u003ch2>以验证结果决定下一期范围。\u003c/h2>\u003cp>以下是建议交付顺序，不代表已完成或已承诺排期。各阶段分别验收；团队规模、外部接口和试点反馈明确后再估工期。\u003c/p>\u003c/div>\n      \u003cdiv class=\"roadmap\">\n        \u003carticle class=\"phase\">\u003cdiv class=\"phase-rail\">\u003cb>P0\u003c/b>\u003cspan>当前建议\u003c/span>\u003c/div>\u003cdiv class=\"phase-content\">\u003cdiv class=\"phase-title\">\u003ch3>讲清并确认业务闭环\u003c/h3>\u003cspan class=\"tag good\">产品验证\u003c/span>\u003c/div>\u003cdiv class=\"phase-grid\">\u003cdiv>\u003ch4>交付范围\u003c/h4>\u003cul>\u003cli>报销交互原型：表达、补正、审批、付款及凭证草稿。\u003c/li>\u003cli>运营、日常办公、财务与老板共享报销示例；人力用请假对照。\u003c/li>\u003cli>业务字段、附件清单、三类状态及角色权限说明。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch4>验证方式与责任\u003c/h4>\u003cul>\u003cli>产品负责人组织；老板、员工和会计共同走查。\u003c/li>\u003cli>用匿名化真实材料覆盖差旅、采购垫付等常见情况。\u003c/li>\u003cli>确认缺票、重复票、驳回重提和已付款更正等例外。\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"gate\">\u003cb>进入下一期\u003c/b>\u003cspan>每个节点的责任人、依据、异常去向明确；同一笔业务不会出现“批准即付款”或“重复入账”的解释冲突。\u003c/span>\u003c/div>\u003cdiv class=\"phase-dep\">前置：选定试点客户与一位参与评审的会计。本文件给出方案；配套原型已演示报销，后续仍需客户材料走查与真实实现。\u003c/div>\u003c/div>\u003c/article>\n        \u003carticle class=\"phase\">\u003cdiv class=\"phase-rail\">\u003cb>P1\u003c/b>\u003cspan>报销闭环\u003c/span>\u003c/div>\u003cdiv class=\"phase-content\">\u003cdiv class=\"phase-title\">\u003ch3>让真实报销在线办完\u003c/h3>\u003cspan class=\"tag blue\">最小可用版本\u003c/span>\u003c/div>\u003cdiv class=\"phase-grid\">\u003cdiv>\u003ch4>交付范围\u003c/h4>\u003cul>\u003cli>文字与附件输入、AI 整理、员工确认及补正。\u003c/li>\u003cli>固定审批模板＋金额分支、角色权限和处理记录。\u003c/li>\u003cli>报销台账、人工付款结果登记、会计资料包导出。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch4>验证方式与责任\u003c/h4>\u003cul>\u003cli>产品与研发交付；试点客户指定业务经办人。\u003c/li>\u003cli>用试点材料确认字段核对和重复检测的效果。\u003c/li>\u003cli>观察办理时长、补正次数与每单人工处理时间。\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"gate\">\u003cb>进入下一期\u003c/b>\u003cspan>建议每家试点完成一个完整报销周期；试点清单内的单据均可追溯，权限隔离、重复付款拦截及异常处理验收通过。核对实际人工投入后再扩大范围。\u003c/span>\u003c/div>\u003cdiv class=\"phase-dep\">前置：P0 通过。首期采用人工付款确认与资料导出，不依赖银行直连或自动税务查验。\u003c/div>\u003c/div>\u003c/article>\n        \u003carticle class=\"phase\">\u003cdiv class=\"phase-rail\">\u003cb>P2\u003c/b>\u003cspan>专业衔接\u003c/span>\u003c/div>\u003cdiv class=\"phase-content\">\u003cdiv class=\"phase-title\">\u003ch3>连接核算，验证人力分流\u003c/h3>\u003cspan class=\"tag\">专业处理\u003c/span>\u003c/div>\u003cdiv class=\"phase-grid\">\u003cdiv>\u003ch4>交付范围\u003c/h4>\u003cul>\u003cli>费用分类与核算模板、凭证草稿、复核及过账回传。\u003c/li>\u003cli>匹配实际付款，区分费用确认与应付款结算。\u003c/li>\u003cli>轻量请假流程与 HR 台账；薪酬只做数据准备和复核。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch4>验证方式与责任\u003c/h4>\u003cul>\u003cli>会计负责核算政策；HR 负责假勤口径。\u003c/li>\u003cli>核对未付款报销、跨期、部分付款及更正路径。\u003c/li>\u003cli>用经复核的凭证结果，与既有会计系统对照。\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"gate\">\u003cb>进入下一期\u003c/b>\u003cspan>选定核算范围内的金额、状态和凭证对应关系核对一致；请假在 HR 形成独立结果，未经确认不进入薪酬；相关角色的敏感数据隔离通过验收。\u003c/span>\u003c/div>\u003cdiv class=\"phase-dep\">前置：P1 稳定使用，明确会计系统或导入格式。财务报表优先承接既有会计系统的已确认结果。\u003c/div>\u003c/div>\u003c/article>\n        \u003carticle class=\"phase\">\u003cdiv class=\"phase-rail\">\u003cb>P3\u003c/b>\u003cspan>按需扩展\u003c/span>\u003c/div>\u003cdiv class=\"phase-content\">\u003cdiv class=\"phase-title\">\u003ch3>复用模板，扩展后台运营\u003c/h3>\u003cspan class=\"tag\">付费验证后启动\u003c/span>\u003c/div>\u003cdiv class=\"phase-grid\">\u003cdiv>\u003ch4>候选范围，按需求选取\u003c/h4>\u003cul>\u003cli>入职清单、员工借款、采购申请或合同付款，逐项验证。\u003c/li>\u003cli>配置审批人与附件要求，发布及追踪流程版本。\u003c/li>\u003cli>接入客户已有协同工具，按价值选择邮箱、银行等通道。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch4>扩展条件与责任\u003c/h4>\u003cul>\u003cli>产品负责人以共性需求和付费意愿排序。\u003c/li>\u003cli>运营负责人记录实施、维护、异常处理成本。\u003c/li>\u003cli>复用业务底座，避免为单个客户重做整套系统。\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"gate\">\u003cb>扩展准入\u003c/b>\u003cspan>报销已持续使用，客户愿意为明确服务范围付费；新增场景有重复需求，且增量交付成本可接受。未满足时继续收敛既有闭环。\u003c/span>\u003c/div>\u003cdiv class=\"phase-dep\">前置：P2 验收与付费验证。完整薪酬、复杂考勤和任意流程编排不自动进入本期。\u003c/div>\u003c/div>\u003c/article>\n      \u003c/div>\n      \u003cdiv class=\"paper\">\u003ch3>试点观察：先采基线，再设目标\u003c/h3>\u003cdiv class=\"table-scroll\" style=\"border:0;margin-top:15px\">\u003ctable>\u003cthead>\u003ctr>\u003cth>观察项\u003c/th>\u003cth>记录方式\u003c/th>\u003cth>用于判断\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>完整办理时长\u003c/td>\u003ctd>从提交到实际付款，区分系统处理与等待人处理\u003c/td>\u003ctd>是否减少跨角色等待\u003c/td>\u003c/tr>\u003ctr>\u003ctd>补正与字段纠错\u003c/td>\u003ctd>逐单记录原因、字段及资料类型\u003c/td>\u003ctd>AI 是否减少录入，附件要求是否清楚\u003c/td>\u003c/tr>\u003ctr>\u003ctd>人工处理成本\u003c/td>\u003ctd>每单处理时间＋每家实施、维护时间\u003c/td>\u003ctd>软件与服务的交付成本是否成立\u003c/td>\u003c/tr>\u003ctr>\u003ctd>持续使用与付费\u003c/td>\u003ctd>后续周期是否主动使用、愿为哪个范围付费\u003c/td>\u003ctd>是否值得扩展为运营中心\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"subtle\" style=\"margin-top:14px\">权限越界、重复付款与重复入账作为验收阻断项；效率改善目标在取得客户现状基线后共同设定，不预填未经验证的准确率或节省比例。\u003c/p>\u003c/div>\n    \u003c/section>\n\n\n    \u003csection id=\"expansion\">\n      \u003cdiv class=\"section-head\">\u003cdiv class=\"eyebrow\">07 / 入口合并与专业能力\u003c/div>\u003ch2>让用户先找到事情，再看到专业能力。\u003c/h2>\u003cp>系统原型采用三个入口。后台只展示办理首页和三个中心，薪酬、资金、发票、凭证等从“更多专业功能”进入。首页用报销与入职说明完整架构。\u003c/p>\u003c/div>\n      \u003cdiv class=\"table-scroll role-matrix\">\u003ctable>\u003cthead>\u003ctr>\u003cth>用户入口\u003c/th>\u003cth>主要工作\u003c/th>\u003cth>如何使用共享底座\u003c/th>\u003cth>关键边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n        \u003ctr>\u003ctd>\u003cb>日常办公 · 手机\u003c/b>\u003c/td>\u003ctd>员工与小赢对话，发起报销、补充资料、查看本人进度\u003c/td>\u003ctd>自然表达整理为草稿，本人确认后进入办理\u003c/td>\u003ctd>仅显示本人及获授权事项；不因对话直接完成审批或付款\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>后台办理 · PC\u003c/b>\u003c/td>\u003ctd>整合运营、人力、财务与审批经办；按岗位处理事项\u003c/td>\u003ctd>流程中心看责任与进度；单据中心核对资料与明细；台账中心查看业务与专业结果\u003c/td>\u003ctd>入口合并，岗位与动作权限独立；薪酬、付款、核算各自授权\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>老板经营 · PC\u003c/b>\u003c/td>\u003ctd>经营问答、关键审批、异常与行动跟进\u003c/td>\u003ctd>读取授权台账，展示口径与来源，需要时下钻具体业务\u003c/td>\u003ctd>申请、批准、付款与已过账口径分别展示；敏感数据单独授权\u003c/td>\u003c/tr>\n      \u003c/tbody>\u003c/table>\u003c/div>\n      \u003cdiv class=\"callout\">\u003cb>架构关系：\u003c/b>三个用户入口 → 流程中心 / 单据中心 / 台账中心 → 财务、人力等专业结果。三个中心是共享业务能力；单据可先到，也可在流程中补正，台账持续更新。\u003c/div>\n      \u003cdiv class=\"table-scroll\" style=\"margin-top:20px\">\u003ctable>\u003cthead>\u003ctr>\u003cth>核心示例\u003c/th>\u003cth>流程中心 · 谁来办\u003c/th>\u003cth>单据中心 · 有何依据\u003c/th>\u003cth>台账中心 · 沉淀什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>报销\u003c/b>\u003c/td>\u003ctd>员工确认 → 主管审批 → 条件老板批准 → 财务复核\u003c/td>\u003ctd>原始表达、票据、住宿明细与已确认的费用明细\u003c/td>\u003ctd>报销记录；付款事实；凭证与核算结果分别记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>入职\u003c/b>\u003c/td>\u003ctd>人力核对与合同确认 → 综合经办设备与账号 → 人力归档\u003c/td>\u003ctd>入职材料、合同签署确认、设备与账号办理记录\u003c/td>\u003ctd>员工档案、入职台账与生效状态；不强行生成会计凭证\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n      \u003cdiv class=\"callout\">\u003cb>直接体验：\u003c/b>\u003ca href=\"./企赢-系统原型.html#expense\" target=\"_blank\" rel=\"noopener\">报销示例 ↗\u003c/a>　\u003ca href=\"./企赢-系统原型.html#onboarding\" target=\"_blank\" rel=\"noopener\">入职示例 ↗\u003c/a>。在任一示例中切换三个中心，业务编号与办理结果保持一致。\u003c/div>\n      \u003cdiv class=\"two-col\" style=\"margin-top:20px\">\n        \u003cdiv class=\"paper\">\u003ch3>薪酬需要一条跨岗位链路\u003c/h3>\u003col>\u003cli>HR 汇总员工、假勤、变动与薪酬依据。\u003c/li>\u003cli>按版本化规则计算应发、扣减与实发，完成复核。\u003c/li>\u003cli>负责人批准薪酬批次，锁定发放清单。\u003c/li>\u003cli>财务或授权付款人执行并记录实际支付结果。\u003c/li>\u003cli>失败、部分成功或退回款项单独跟进；会计核对入账。\u003c/li>\u003c/ol>\u003cp class=\"subtle\" style=\"margin-top:15px\">HR 可以发起发薪流程；资金执行另行授权。原始薪酬明细按最小权限向资金与会计环节提供。\u003c/p>\u003c/div>\n        \u003cdiv class=\"paper\">\u003ch3>老板对话需要可核验的答案\u003c/h3>\u003cul>\u003cli>先明确企业、期间、项目与统计口径。\u003c/li>\u003cli>指标由确定的查询和计算产生，小赢负责理解与解释。\u003c/li>\u003cli>展示“已申请 / 已批准 / 实际付款 / 已过账”等状态。\u003c/li>\u003cli>提供来源下钻、更新时间及数据不完整提示。\u003c/li>\u003cli>解释原因时区分已证实事实与待验证判断。\u003c/li>\u003cli>从发现问题到分派待办，再跟进处理结果。\u003c/li>\u003c/ul>\u003cp class=\"subtle\" style=\"margin-top:15px\">例如“云帆项目本月花了多少”，先区分批准费用与实际支出；没有上期数据时不编造环比或原因。\u003c/p>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"paper\" style=\"margin-top:20px\">\u003ch3>扩展前必须补齐的共同能力\u003c/h3>\u003cdiv class=\"decision-list\">\n        \u003cdiv class=\"decision\">\u003cstrong>组织与主数据\u003c/strong>\u003cp>企业主体、部门、员工、项目、客商、账户等统一编号；人员与业务变更保留生效时间和历史，避免各工作台维护不同版本。\u003c/p>\u003c/div>\n        \u003cdiv class=\"decision\">\u003cstrong>责任与权限\u003c/strong>\u003cp>一人多角色、委托代办、内部外部协作；业务范围、行、字段与动作分别授权，工资及个人资料单独保护。角色切换不等于获得全部数据。\u003c/p>\u003c/div>\n        \u003cdiv class=\"decision\">\u003cstrong>统一待办与异常\u003c/strong>\u003cp>明确每一步责任人、期限、催办与升级；支持退回、撤回、更正、部分成功和外部接口失败。运营负责跟进，专业责任人负责判断。\u003c/p>\u003c/div>\n        \u003cdiv class=\"decision\">\u003cstrong>模板和规则治理\u003c/strong>\u003cp>谁能配置、谁能发布、从何时生效、在途单据用哪个版本；审批规则、费用制度、薪酬规则与会计政策分别由其负责人维护。\u003c/p>\u003c/div>\n        \u003cdiv class=\"decision\">\u003cstrong>依据、口径与追溯\u003c/strong>\u003cp>原件、业务单据、专业台账与结果双向关联；申请、批准、实际与核算不混合；金额与指标由程序计算，AI 输出保留来源。\u003c/p>\u003c/div>\n        \u003cdiv class=\"decision\">\u003cstrong>经营数据来源\u003c/strong>\u003cp>报销和薪酬主要解释支出。分析收入、回款、项目收益等，还需合同或订单、交付、采购和收付款等业务来源；按目标客户选择最少必要台账。未取得的数据不生成推测性经营结论。\u003c/p>\u003c/div>\n        \u003cdiv class=\"decision\">\u003cstrong>接入与服务责任\u003c/strong>\u003cp>首期可用文件导入、资料导出和人工登记，后续按需接邮箱、协同工具、银行及会计系统；同步记录谁催补、谁处理异常和每家交付成本。\u003c/p>\u003c/div>\n      \u003c/div>\u003c/div>\n      \u003cdiv class=\"callout warn\">\u003cb>建议扩展顺序：\u003c/b>先完成同一后台与共享中心 → 保持报销闭环 → 用入职验证跨岗位协同，再补离职与请假 → 薪酬计算与支付协同单独验证 → 老板对话先覆盖已有台账的少量确定指标。复杂工资、自动发薪与任意分析不同时启动。\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"decisions\">\n      \u003cdiv class=\"section-head\">\u003cdiv class=\"eyebrow\">08 / 首版边界与决策\u003c/div>\u003ch2>保留长期架构，收紧第一版的承诺。\u003c/h2>\u003cp>先让报销成为可靠的业务模块。三个入口与共享中心统一设计，完整的人力、财务套件按验证顺序逐步建设。\u003c/p>\u003c/div>\n      \u003cdiv class=\"two-col\">\u003cdiv class=\"paper\">\u003ch3>首版必须具备\u003c/h3>\u003cul>\u003cli>同一业务记录、附件依据及字段来源。\u003c/li>\u003cli>确认、补正、审批、付款登记的闭环。\u003c/li>\u003cli>专业台账与资料导出。\u003c/li>\u003cli>角色权限、租户隔离和操作留痕。\u003c/li>\u003cli>AI 失败时的人工办理路径。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"paper\">\u003ch3>后续按需增加\u003c/h3>\u003cul>\u003cli>语音转文字、邮箱自动收票、协同工具接入。\u003c/li>\u003cli>税务平台查验与银行付款通道。\u003c/li>\u003cli>完整薪酬、社保申报与复杂考勤。\u003c/li>\u003cli>通用流程设计器及自研完整会计系统。\u003c/li>\u003cli>采购、合同与更多行业业务模板。\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n      \u003cdiv class=\"paper\" style=\"margin-top:20px\">\u003ch3>进入实施前，需要收敛的四个决定\u003c/h3>\u003cdiv class=\"decision-list\">\u003cdiv class=\"decision\">\u003cstrong>客户与材料\u003c/strong>\u003cp>建议选择报销制度和资料形态接近的团队；获取匿名化样本、现有规则与退单原因。由此确定首批支持的费用类型。\u003c/p>\u003c/div>\u003cdiv class=\"decision\">\u003cstrong>首个使用入口\u003c/strong>\u003cp>建议先用网页中的文字对话＋附件完成闭环；语音作为后续输入方式。若试点客户统一使用飞书或企微，再优先接入该入口。\u003c/p>\u003c/div>\u003cdiv class=\"decision\">\u003cstrong>会计衔接方式\u003c/strong>\u003cp>建议 P1 导出经复核资料包，P2 对接选定会计系统的凭证导入或 API；先确认核算政策、格式和回传状态。\u003c/p>\u003c/div>\u003cdiv class=\"decision\">\u003cstrong>交付责任\u003c/strong>\u003cp>建议首期由客户指定经办人，产品提供辅助；若包含代办，单独约定谁催补、谁处理异常、交付什么结果，并记录人工成本。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"callout\">\u003cb>下一份可实施交付：\u003c/b>报销与入职的字段、状态及岗位权限定义；用原型验证正常办理、补正、退回和生效日期。\u003c/div>\n    \u003c/section>\n    \u003cfooter class=\"footer\">\u003cspan>企赢 · 产品方案与路线图 v1.3\u003c/span>\u003cspan>2026.11.12 · 根据本次讨论整理 · 示例数据仅用于讲解\u003c/span>\u003c/footer>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n  'use strict';\n  const roleData = {\n    operations: { title:'两条示例，一套办理入口', desc:'首页只保留核心示例；流程、单据和台账共用业务上下文。综合经办、人力、财务和审批岗位按职责处理。', badge:'后台办理', tasks:[['林悦 · 差旅报销','财务协同','员工对话 → 审批与复核 → 原始票据 → 报销台账 → 付款与核算。'],['张明 · 入职办理','人力协同','核对资料、确认合同、准备设备与账号，再归档员工与入职台账。']], metric:'2 条', metricLabel:'核心业务示例', note:'更多专业功能放在二级入口：薪酬、资金、发票、凭证、采购与资产。', a  });\n    const panel=document.getElementById('role-panel');\n    panel.setAttribute('aria-labelledby','tab-'+role);\n    panel.innerHTML=`\u003cdiv class=\"workspace-head\">\u003cdiv>\u003ch3>${r.title}\u003c/h3>\u003cp>${r.desc}\u003c/p>\u003c/div>\u003cspan class=\"tag good\">${r.badge} · 演示\u003c/span>\u003c/div>\u003cdiv class=\"work-grid\">\u003cdiv>${r.tasks.map(t=>`\u003cdiv class=\"task\">\u003cdiv class=\"task-top\">\u003cstrong>${t[0]}\u003c/strong>\u003cspan class=\"tag\">${t[1]}\u003c/span>\u003c/div>\u003cp>${t[2]}\u003c/p>\u003c/div>`).join('')}\u003ca class=\"inline-link role-journey\" href=\"#journey\">${r.link} \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003caside class=\"work-side\">\u003cspan class=\"subtle\">${r.metricLabel}\u003c/span>\u003cdiv class=\"big\">${r.metric}\u003c/div>\u003cp>${r.note}\u003c/p>\u003cdiv class=\"rule-note\">\u003cb>权限边界\u003c/b>\u003cbr>${r.access}\u003c/div>\u003c/aside>\u003c/div>`;\n    panel.querySelector('.role-journey').addEventListener('click',()=>setScenario(r.scenario));\n  }\n  document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>renderRole(b.dataset.role)));\n  document.querySelector('.role-tabs').addEventListener('keydown',e=>{\n    const tabs=[...document.querySelectorAll('[data-role]')];\n    const i=tabs.indexOf(document.activeElement); if(i\u003c0)return;\n    let n=i; if(e.key==='ArrowRight')n=(i+1)%tabs.length; else if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length; else if(e.key==='Home')n=0; else if(e.key==='End')n=tabs.length-1; else return;\n    e.preventDefault();renderRole(tabs[n].dataset.role);tabs[n].focus();\n  });\n  function renderStep() {\n    const c=cases[scenario],s=c.steps[step];\n    document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.step)===step)));\n    document.getElementById('trace-panel').innerHTML=`\u003cdiv>\u003cdiv class=\"caption\" style=\"margin-bottom:8px\">阶段 aw=input.value;\n    const threshold=Number(raw), valid=raw!==''&&Number.isFinite(threshold)&&threshold>=0&&threshold\u003c=10000000;\n    input.setAttribute('aria-invalid',String(!valid));\n    const line=document.getElementById('route-line'),reason=document.getElementById('route-reason');\n    if(!valid){line.innerHTML='';reason.textContent='请输入 0–10,000,000 之间的有效金额，再查看审批路径。';}\n    else {\n      const boss=1286>threshold;\n      line.innerHTML=`\u003cspan class=\"route-node\">员工提交\u003c/span>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"route-node\">主管审批\u003c/span>${boss?'\u003cspan aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"route-node boss\">老板审批\u003c/span>':''}\u003cspan aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"route-node\">财务复核\u003c/span>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"route-node\">待付款\u003c/span>`;\n      reason.textContent=`¥1,286 ${boss?'超过':'未超过'} ¥${threshold.toLocaleString('zh-CN')}，${boss?'增加':'不增加'}老板审批。此处仅测试规则，不提交或发布配置。`;\n    }\n    document.getElementById('project-rule').textContent=document.getElementById('project-required').checked?'项目必填：员工确认业务归属后才能提交。AI 可以建议项目，不能替员工作最终确认。':'项目选填：允许提交；未归属费用进入“待归集”清单，不由 AI 编造项目。';\n  }\n  document.getElementById('approval-threshold').addEventListener('input',renderRoute);\n  document.getElementById('project-required').addEventListener('change',renderRoute);\n  const media=window.matchMedia('(prefers-color-scheme: dark)');\n  function themeIsDark(){return document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':media.matches;}\n  function syncThemeLabels(){document.querySelectorAll('.theme-button').forEach(b=>b.textContent=themeIsDark()?'切换浅色':'切换深色');}\n  document.querySelectorAll('.theme-button').forEach(b=>b.addEventListener('click',()=>{document.documentElement.dataset.theme=themeIsDark()?'light':'dark';syncThemeLabels();}));\n  media.addEventListener('change',syncThemeLabels);\n  document.querySelectorAll('.print-button').forEach(b=>b.addEventListener('click',()=>window.print()));\n  const navLinks=[...document.querySelectorAll('.nav a')];\n  const sections=[...document.querySelectorAll('main section')];\n  let scrollScheduled=false;\n  function syncNavigation(){\n    let current=sections[0];\n    sections.forEach(s=>{if(s.getBoundingClientRect().top\u003c=Math.min(160,innerHeight*.2))current=s;});\n    navLinks.forEach(a=>{const active=a.hash==='#'+current.id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});\n    scrollScheduled=false;\n  }\n  window.addEventListener('scroll',()=>{if(!scrollScheduled){scrollScheduled=true;requestAnimationFrame(syncNavigation);}},{passive:true});\n  window.addEventListener('resize',syncNavigation);\n  document.getElementById('print-cases').innerHTML='\u003ch3>打印附录 · 两个案例的完整阶段说明\u003c/h3>'+Object.entries(cases).map(([key,c])=>`\u003ch3 style=\"margin-top:20px\">${key==='expense'?'报销主线':'请假对照'}\u003c/h3>${c.steps.map((s,i)=>`\u003carticle>\u003ch4>${i+1}. ${escapeHTML(s.name)} · ${escapeHTML(s.title)}\u003c/h4>\u003cp>责任人：${escapeHTML(s.owner)}。交付：${escapeHTML(s.output)}。\u003c/p>\u003cp>${escapeHTML(s.rule)}\u003c/p>\u003cp>${escapeHTML(s.evidence)}\u003c/p>\u003c/article>`).join('')}`).join('');\n  renderRole('employee');setScenario('expense');renderRoute();syncThemeLabels();syncNavigation();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

function architecture(){return `<div class="architecture-screen"><div class="between"><div><h3>三个用户入口，同一个运营底座</h3><p class="small muted" style="margin-top:7px">员工用手机对话，后台按岗位办理，老板聚焦经营。</p></div><span class="tag green">共享记录 · 按权可见</span></div><div class="role-grid">${[['chat','日常办公','手机 · 发起与查询'],['ledger','后台办理','PC · 综合 / 人力 / 财务'],['chart','老板经营','PC · 审批与经营']].map(([ic,title,desc])=>`<div class="role-card ${title==='日常办公'||title==='后台办理'?'active':''}">${I(ic,25)}<b>${title}</b><small>${desc}</small></div>`).join('')}</div><div class="shared-layer"><b>同一份业务记录与原始依据</b><small>流程、单据与台账按同一编号关联 / 岗位权限 / 版本与留痕</small></div><div class="architecture-stages">${[['chat','流程中心','对话发起，按职责办理'],['file','单据中心','就源采集，明细可回溯'],['ledger','台账中心','关联业务，记录事实'],['check','专业结果','按专业政策交付']].map(([ic,title,desc])=>`<div>${I(ic,22)}<b>${title}</b><small>${desc}</small></div>`).join('')}</div><div class="arch-output"><div><b>报销 → 收支与核算</b><small>付款记录、费用归集、凭证与报表依据。</small></div><div><b>入职 → 员工档案与办理记录</b><small>人力与综合经办协同，按生效日期更新档案。</small></div></div><div class="notice neutral">HR 默认不查看本笔报销金额与票据。角色岗位共享底座，业务数据按职责隔离。</div></div>`;}

 {chapter:'产品愿景',label:'从一句话到一笔清晰的账',title:'把后台的事，<br>一件件办完。',lead:'员工说清楚，助理来整理。<br>老板确认关键事项，专业人员交付结果。',points:[['员工用对话','手机里说一句，资料随手补。'],['专业人员用工作台','在 PC 上核对、审批、付款与核算。'],['全程共用一笔业务','过程和结果都能回到原始依据。']],lesson:'今天，只看一笔 ¥1,286 的差旅报销。',level:0,scene:()=>`<div class="scene cover"><div class="cover-browser">${browser(pcTitle('后台运营工作台','业务有来源，办理有进度。')+metrics([['待我复核','1 笔','本笔差旅报销'],['待付金额','¥1,286','演示数据'],['项目归属','云帆','交付与验收']])+`<div class="pc-panel"><div class="pc-panel-head"><b>林悦 · 差旅报销</b><span class="tag amber">待复核</span></div>${tableLines()}</div>`,{actor:'陈晨',role:'财务经办',title:'财务工作台',active:'报销台账'})}</div><div class="cover-phone">${phone(`<div class="chat-time">今天 09:41</div>${voiceBubble()}${msg('我来整理这次差旅费用。高铁、酒店和打车合计 ¥1,286，请核对项目与材料。')}${expenseCard({button:false})}`)}</div><div class="cover-label"><span class="eyebrow">ONE RECORD / EVERY ROLE</span><strong>从自然表达，<br>走向确定的专业结果。</strong><p>一笔业务贯穿员工、主管、老板与财务。每个角色看到自己该处理的部分。</p></div></div>`,notes:'先把产品定位讲清：这不是单独的票据识别器。我们要把员工发起到后台办结连起来。今天不展开大而全的功能，用同一笔报销带大家看完整过程。',cue:'停留在手机与 PC 的组合画面，介绍两种工作方式。'},
 {chapter:'员工 · 移动端',label:'语音发起',title:'按下麦克风，<br>把费用说清楚。',lead:'离开客户现场，员工不必先找表单。把这次差旅说给助理听。',points:[['语音、文字都能进入','入口符合员工在移动端的习惯。'],['先转写，再让员工确认','表达不明确的内容继续追问。'],['语音与转写保留关联','后续可以回看最初是怎么说的。']],lesson:'现场可点麦克风，体验录音与转写。',level:1,scene:()=>`<div class="scene">${phone(`<div class="chat-time">11 月 9 日 09:41</div>${msg('你好，林悦。我是小赢，今天有什么需要我帮你办理的？')}${msg('你可以直接说费用，或把票据发给我。')}<div class="mobile-card"><div class="mobile-card-body"><div class="voice-tip">${I('mic',21)}<b>点左下方麦克风，开始语音演示</b></div><p class="tiny muted">示例：广州项目交付的高铁、酒店和打车费用。</p><button type="button" class="btn primary" data-action="voice-start">${I('mic',16)} 说一段差旅费用</button></div></div>`,{large:true,kind:'voice'})}<div class="inspector"><div class="inspector-card"><span class="eyebrow">从用户表达开始</span><h3>“上周去广州给云帆项目做交付，高铁 286，酒店 800，打车 200。”</h3><p>一段话包含业务背景、项目、费用类型和金额。员工仍需确认，助理不根据语气决定真实性。</p><div class="tag green">语音 → 文字 → 草稿</div></div><div class="inspector-card"><h3>移动端的真实操作细节</h3><p>麦克风入口、录音时长、声音波形、取消录音、完成转写，以及转写后的核对。</p><span class="tiny muted">本页为语音交互演示，不调用真实麦克风。</span></div></div></div>`,notes:'从员工的真实场景开始。走出客户办公室，拿起手机就能说。点击麦克风演示录音状态，然后完成并转写。强调转写只是输入，不代表系统已经批准。',cue:'点击麦克风 → 等待两秒 → 完成并转写 → 确认转写。'},
 {chapter:'员工 · 信息确认',label:'从原话到结构化单据',title:'助理先整理，<br>员工再确认。',lead:'自然表达变成有依据的字段。金额可以计算，业务归属需要人确认。',points:[['把三项费用拆出来','286＋800＋200＝1,286。'],['关联项目与事由','识别建议与员工确认分开记录。'],['每个字段保留来源','原话、票据、人工补充都可回溯。']],lesson:'AI 提供候选信息，员工确认业务事实。',level:2,scene:()=>`<div class="scene">${phone(`<div class="chat-time">今天 09:42</div>${voiceBubble()}${msg('已整理三项费用，共 ¥1,286。项目建议为“云帆项目”，请核对后确认。')}${expenseCard()}`,{large:true,time:'09:42'})}<div class="inspector"><div class="inspector-card"><h3>从原始表达，到专业字段</h3>${[['“给云帆项目做交付”','云帆项目','来源：原话 / 待确认'],['“高铁286”','交通费 ¥286','来源：原话＋票据'],['“酒店800”','住宿费 ¥800','来源：原话＋票据'],['三项费用','合计 ¥1,286','按明细计算']].map(([a,b,n])=>`<div class="mapping-row"><div class="source-value">${a}</div><span>→</span><div class="structured-value">${b}<small>${n}</small></div></div>`).join('')}</div><div class="notice neutral">没有明确的字段会追问，不自动编造项目、日期或附件。</div></div></div>`,notes:'不要把自然语言直接连到付款。中间有一张由员工确认的结构化单据。这里可以点核对报销信息，展示事由和项目的确认过程。',cue:'点击“核对报销信息”，查看确认弹窗。'},

function renderSlides(){$('#slide-wrap').innerHTML=slides.map((s,i)=>`<section class="slide ${i===0?'active':''}" id="slide-${i+1}" aria-label="第 ${i+1} 页，${s.label}" aria-hidden="${i!==0}"><div class="slide-shell"><div class="slide-top"><div class="identity"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>企赢</b><span> / ${s.chapter}</span></div>${architectureRail(i)}</div><div class="story-layout"><div class="story"><div class="eyebrow">${String(i+1).padStart(2,'0')} / ${s.label}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p><div class="story-flow">${s.points.map(([a,b],n)=>`<div class="story-point"><span class="point-no">${n+1}</span><div><b>${a}</b><small>${b}</small></div></div>`).join('')}</div><div class="story-lesson">${s.lesson}<div class="step-deposit"><span>本步沉淀</span><b>${architectureStory[i].deposit}</b></div></div></div>${s.scene()}</div><div class="slide-bottom"><span>以报销为例 · 样例业务 BX-20261109-001</span><div class="dual-value"><span>员工侧 · <strong>${architectureStory[i].user}</strong></span><i>↔</i><span>运营侧 · <strong>${architectureStory[i].ops}</strong></span></div><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></div></div></section>`).join('');$('#slide-dots').innerHTML=slides.map((s,i)=>`<button type="button" data-slide="${i}" aria-label="第 ${i+1} 页：${s.label}" title="${s.label}"></button>`).join('');}
function resize(){document.documentElement.style.setProperty('--toolbar-height',$('.deck-toolbar').offsetHeight+'px');if(document.body.classList.contains('plan-mode'))return;if(reading){$$('.reading .pc-scene').forEach(scene=>{const browser=scene.querySelector('.browser');if(innerWidth<=750&&browser){const scale=scene.clientWidth/900;browser.style.transform=`scale(${scale})`;scene.style.height=(650*scale+25)+'px';}else{scene.style.height='';if(browser)browser.style.transform='';}});$$('.reading .cover-browser').forEach(el=>{if(innerWidth<=750){const scale=(el.closest('.scene').clientWidth)/690;el.style.transform=`scale(${scale})`;}else el.style.transform='';});return;}const toolbar=$('.deck-toolbar').offsetHeight;const scale=Math.min((innerWidth-32)/1600,(innerHeight-toolbar-72)/900,1.25);const width=Math.max(.2,scale)*1600,height=Math.max(.2,scale)*900;$('#slide-wrap').style.width=width+'px';$('#slide-wrap').style.height=height+'px';$$('.slide').forEach(el=>el.style.transform=`scale(${Math.max(.2,scale)})`);$('.viewport').style.height=`calc(100dvh - ${toolbar+56}px)`;}
function go(index,{hash=true}={}){stopRecording();current=Math.max(0,Math.min(slides.length-1,index));$$('.slide').forEach((el,i)=>{el.classList.toggle('active',i===current);el.setAttribute('aria-hidden',String(!reading&&i!==current));el.inert=!reading&&i!==current;});$$('[data-slide]').forEach(b=>{if(Number(b.dataset.slide)===current)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});$('#page-count').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;$('#prev').disabled=current===0;$('#next').disabled=current===slides.length-1;$('#notes-title').textContent=`${current+1}. ${slides[current].label}`;$('#notes-text').textContent=slides[current].notes;$('#notes-cue').textContent='讲解动作：'+slides[current].cue;document.title=`${slides[current].label} · 企赢产品发布演示`;if([2,4].includes(current)){$$('#slide-'+(current+1)+' .phone-chat').forEach(el=>el.scrollTop=el.scrollHeight);}if(hash)history.replaceState(null,'','#slide-'+(current+1));if(reading)$('#slide-'+(current+1)).scrollIntoView({behavior:'smooth',block:'start'});}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3000);}
function openModal(title,body,foot=''){const d=$('#modal');d.classList.remove('arch-modal');d.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button type="button" class="close-btn" data-action="close" aria-label="关闭">${I('close',17)}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;if(!d.open)d.showModal();}
function stopRecording(){clearInterval(recordTimer);recordTimer=null;if(recordPhone)recordPhone.classList.remove('recording');recordPhone=null;}
function startRecording(phone){if(!phone)return;if(recordPhone===phone)return finishRecording();stopRecording();recordPhone=phone;recordSeconds=0;phone.classList.add('recording');phone.querySelector('.record-timer').textContent='00:00';recordTimer=setInterval(()=>{recordSeconds++;if(recordPhone)recordPhone.querySelector('.record-timer').textContent='00:'+String(recordSeconds).padStart(2,'0');if(recordSeconds>=30)finishRecording();},1000);}
function finishRecording(){stopRecording();openModal('语音转写 · 请确认',`<div class="notice neutral">这是一段预设语音的转写演示，不调用麦克风或真实识别服务。</div><div class="modal-field"><label for="transcript-text">转写内容</label><textarea id="transcript-text" rows="4">${SAMPLE}</textarea></div><p class="small muted">员工可以修改转写。下一步由助理整理成候选字段，再核对确认。</p>`,`<button type="button" class="btn" data-action="close">继续修改</button><button type="button" class="btn primary" data-action="confirm-transcript">确认转写并整理</button>`);}

else if(action==='confirm-reject'){const reason=$('#return-comment').value.trim();if(!reason)return toast('请填写具体的退回原因。');openModal('退回意见已回到员工端',`<div class="notice warn">${esc(reason)}</div><p class="small muted">员工在对话中收到明确补正要求。本发布演示保留正常办理主线；完整退回重提可在独立原型中体验。</p>`,`<button type="button" class="btn primary" data-action="close">回到当前环节</button>`);}
else if(action==='finance-approve'){if(!currentSlide.querySelector('.finance-confirm').checked)return toast('请先确认已核对本例资料与金额。');go(8);toast('财务复核通过，形成待付款任务。');}
else if(action==='payment')openModal('登记付款结果',`<div class="notice warn">本页演示支付之后的结果登记，不发起真实转账。</div><div class="modal-field"><label>收款人 / 账户</label><input value="林悦 · 招商银行 · 尾号6028（示例）" readonly></div><div class="modal-field"><label>付款金额</label><input value="¥1,286.00" readonly></div><div class="modal-field"><label for="payment-ref">付款凭据编号</label><input id="payment-ref" value="DEMO-PAY-20261109-001"></div><label class="check-label"><input type="checkbox" id="payment-check">已核对付款日期、金额与凭据（演示）</label>`,`<button type="button" class="btn" data-action="close">取消</button><button type="button" class="btn primary" data-action="confirm-payment">确认登记</button>`);
else if(action==='confirm-payment'){if(!$('#payment-ref').value.trim()||!$('#payment-check').checked)return toast('请填写凭据并确认付款信息。');$('#modal').close();go(9);toast('付款结果已登记，进入会计凭证复核。');}
else if(action==='post'){if(!currentSlide.querySelector('.posting-confirm').checked)return toast('请先确认核算依据、科目与金额。');go(10);toast('演示过账完成，结果回到员工端。');}
else if(action==='trace')trace();
else if(action==='progress')openModal('本笔报销进度',`<div class="notice">业务 BX-20261109-001 · ¥1,286.00</div><p class="small muted">本演示按预设节点呈现完整故事。当前讲解环节：${slides[current].label}。审批、付款和核算各有独立记录。</p>`,`<button type="button" class="btn" data-action="trace">查看完整预设来源链</button>`);
else if(action==='send-message'){const input=b.closest('.phone').querySelector('.composer-input');const text=input.value.trim();if(!text)return toast('可以输入问题，或点麦克风体验语音。');input.value='';openModal('小赢 · 对话演示',`<div class="notice neutral">你：${esc(text)}</div><p class="small">本次发布演示围绕预设的 ¥1,286 报销案例展开。可通过语音、材料核对和各阶段按钮体验产品细节；自由办理请打开完整交互原型。</p>`,`<button type="button" class="btn primary" data-action="close">继续当前演示</button>`);}
});
$('#prev').addEventListener('click',()=>go(current-1));$('#next').addEventListener('click',()=>go(current+1));
document.addEventListener('keydown',e=>{if(document.body.classList.contains('plan-mode'))return;if($('#modal').open){if(e.key==='Escape')stopRecording();return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&e.target===document.body)){e.preventDefault();go(current+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}else if(e.key.toLowerCase()==='n')$('#notes-button').click();else if(e.key.toLowerCase()==='f')$('[data-action="fullscreen"]').click();else if(e.key==='Escape'){$('#notes').classList.remove('open');$('#notes-button').setAttribute('aria-pressed','false');stopRecording();}});
function showDocument(mode){const isPlan=mode==='plan';stopRecording();if($('#modal').open)$('#modal').close();document.body.classList.toggle('plan-mode',isPlan);$('#plan-mode-button').setAttribute('aria-pressed',String(isPlan));$('#deck-mode-button').setAttribute('aria-pressed',String(!isPlan));$('#notes').classList.remove('open');$('#notes-button').setAttribute('aria-pressed','false');if(isPlan){const frame=$('#plan-frame');if(!frame.dataset.loaded){frame.srcdoc=JSON.parse($('#plan-source').textContent).replace('<base href="./">','<base href="'+new URL('./',location.href).href+'">');frame.dataset.loaded='true';}document.title='企赢 · 产品方案与路线图';history.replaceState(null,'','#plan');}else go(current);resize();}
window.addEventListener('hashchange',()=>{if(location.hash==='#plan')showDocument('plan');else if(document.body.classList.contains('plan-mode'))showDocument('deck');});
window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#slide-',''))-1;if(Number.isInteger(n)&&n>=0&&n<slides.length)go(n,{hash:false});});
renderSlides();$$('.browser').forEach(b=>{let action=b.querySelector('.app-action');const payment=b.querySelector('[data-action="payment"]');if(!action&&payment){action=document.createElement('div');action.className='app-action';const note=document.createElement('span');note.className='small muted';note.textContent='核对付款日期、收款人与支付凭据后登记。';action.append(note);const wrapper=payment.parentElement;action.append(payment);wrapper.remove();}if(action){b.querySelector('.app-main').append(action);action.style.flexShrink='0';}});const initial=Number(location.hash.replace('#slide-',''))-1;if(innerWidth<750){reading=true;document.body.classList.add('reading');$('#reading-button').textContent='返回放映';$('#reading-button').setAttribute('aria-pressed','true');}go(Number.isInteger(initial)&&initial>=0&&initial<slides.length?initial:0);resize();if(requestedPlan)showDocument('plan');
</script>
